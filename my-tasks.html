<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои задачи — Сделает</title><link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><img src="assets/logo-icon.svg" alt=""><div>Сдела<span>ет</span></div></a><nav class="app-nav"><a class="active" href="my-tasks.html">▤ Мои задачи</a><a href="create-task.html">＋ Новая задача</a><a href="profile.html">◉ Профиль</a></nav><div class="sidebar-spacer"></div><a class="muted" href="/" style="padding:10px 12px;font-size:12px">← На главную</a></aside><main class="app-main"><div class="app-content"><div class="page narrow"><div class="eyebrow">Мои задачи</div><h1 class="hero-title">Продолжите с того места, где остановились</h1><div id="taskList" class="task-list"></div></div></div></main></div><script>var box=document.getElementById('taskList'),task=sdGetTask(),requests=sdGetRequests();if(!task){var empty=document.createElement('section');empty.className='card';empty.innerHTML='<h2 class="section-title">Задач пока нет</h2><p class="lead">Опишите, что нужно сделать — сервис поможет подготовить понятное ТЗ.</p><a class="btn primary" href="create-task.html">+ Новая задача</a>';box.appendChild(empty)}else{var prepared=Object.values(requests).filter(function(v){return v==='prepared'||v==='sent'}).length;var sent=Object.values(requests).filter(function(v){return v==='sent'}).length;var card=document.createElement('section');card.className='task-card';card.innerHTML='<div class="eyebrow">'+(task.city||'Задача')+'</div><h2>'+((task.category||'Задача'))+'</h2><p class="muted">'+(task.scope||task.description||'')+'</p><div class="task-stats"><span class="task-stat">Подбор исполнителей</span><span class="task-stat">5 кандидатов найдено</span><span class="task-stat">'+prepared+' запросов подготовлено</span>'+(sent?'<span class="task-stat">'+sent+' отправлено</span>':'')+'</div><a class="btn primary" href="candidates.html">Продолжить →</a>';box.appendChild(card)}</script></body></html>
