name: Customer flow regression
on:
  pull_request:
    paths:
      - 'create-task.html'
      - 'task-tz.html'
      - 'payment-success.html'
      - 'requests.html'
      - 'src/server.mjs'
      - 'src/site-crawler.mjs'
      - 'src/outreach.mjs'
      - 'tests/v20-flow-regression.mjs'
      - '.github/workflows/v20-verify.yml'
  push:
    branches: [main]
    paths:
      - 'create-task.html'
      - 'task-tz.html'
      - 'payment-success.html'
      - 'requests.html'
      - 'src/server.mjs'
      - 'src/site-crawler.mjs'
      - 'src/outreach.mjs'
      - 'tests/v20-flow-regression.mjs'
      - '.github/workflows/v20-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check src/server.mjs
          node --check src/site-crawler.mjs
          node --check src/outreach.mjs
      - name: Customer flow regression
        run: node tests/v20-flow-regression.mjs
