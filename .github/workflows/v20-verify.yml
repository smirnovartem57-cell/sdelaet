name: Customer flow regression
on:
  pull_request:
    paths:
      - 'create-task.html'
      - 'task-tz.html'
      - 'payment-success.html'
      - 'requests.html'
      - 'src/server.mjs'
      - 'src/site-crawler.mjs'
      - 'src/outreach.mjs'
      - 'tests/v20-flow-regression.mjs'
      - '.github/workflows/v20-verify.yml'
  push:
    branches: [main]
    paths:
      - 'create-task.html'
      - 'task-tz.html'
      - 'payment-success.html'
      - 'requests.html'
      - 'src/server.mjs'
      - 'src/site-crawler.mjs'
      - 'src/outreach.mjs'
      - 'tests/v20-flow-regression.mjs'
      - '.github/workflows/v20-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check src/server.mjs
          node --check src/site-crawler.mjs
          node --check src/outreach.mjs
      - name: Customer flow regression
        run: node tests/v20-flow-regression.mjs

      - name: Production attribution runtime smoke
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 15 https://onsdelaet.ru/create-task.html)"
          printf '%s' "$html" | grep -q 'assets/prod-ui.js'
          ui="$(curl -fsS --max-time 15 https://onsdelaet.ru/assets/prod-ui.js)"
          printf '%s' "$ui" | grep -q 'getClientID'
          printf '%s' "$ui" | grep -q 'sdelaet.attribution.first.v1'
          printf '%s' "$ui" | grep -q 'sdelaet.attribution.last.v1'
          printf '%s' "$ui" | grep -q 'estimate_compare'
          printf '%s' "$ui" | grep -q 'task_created:1'
          printf '%s' "$ui" | grep -q 'payment_success:1'
          task="$(curl -fsS --max-time 15 https://onsdelaet.ru/task-tz.html)"
          printf '%s' "$task" | grep -q 'sdAttributionForTask'
          echo PRODUCTION_ATTRIBUTION_RUNTIME_PASS
