name: Deploy site to FirstVDS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'src/**'
      - 'tests/**'
      - 'docs/product/**'
      - 'tools/**'
      - 'ops/**'
      - '.github/workflows/deploy-site-vds.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate platform readiness
        run: node tools/platform-readiness.mjs
      - name: Validate Metrika goal wiring
        run: node tests/metrika-goals-regression.mjs
      - name: Validate server-side deploy contract
        run: node tests/deploy-path-regression.mjs
      - name: Wait for exact server-side deploy
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for attempt in $(seq 1 36); do
            actual="$(curl -fsS --max-time 10 "https://onsdelaet.ru/assets/deploy-version.txt?ts=$(date +%s)" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$actual" = "$expected" ]; then
              echo "FirstVDS exact deploy confirmed: $actual"
              exit 0
            fi
            echo "Waiting for FirstVDS: attempt=$attempt current=${actual:-none} expected=$expected"
            sleep 5
          done
          echo "::error::FirstVDS server-side deploy did not reach exact SHA $expected"
          exit 1
