name: Deploy site to FirstVDS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.html','assets/**','tests/**','docs/product/**','.github/workflows/deploy-site-vds.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/category-engine.js assets/expert-agent.js assets/offer-parser.js assets/offer-followup.js assets/offer-merge.js assets/offer-normalizer.js assets/recommendation-status.js assets/recommendation-actions.js assets/comparison-explainer.js assets/launch-v2.js; do node --check "$f"; done
          node tests/seasonal-category-routing-regression.mjs
          node tests/seasonal-expert-regression.mjs
          node tests/balcony-insulation-regression.mjs
          node tests/offer-parser-regression.mjs
          node tests/offer-followup-regression.mjs
          node tests/offer-merge-regression.mjs
          node tests/balcony-offer-normalizer-regression.mjs
          node tests/recommendation-status-regression.mjs
          node tests/recommendation-actions-regression.mjs
          node tests/comparison-explainer-regression.mjs
          node tests/balcony-e2e-regression.mjs
      - name: Prepare SSH
        shell: bash
        env: { VDS_HOST: "${{ secrets.VDS_HOST }}", VDS_USER: "${{ secrets.VDS_USER }}", VDS_SSH_KEY: "${{ secrets.VDS_SSH_KEY }}" }
        run: |
          set -euo pipefail
          test -n "$VDS_HOST" || { echo 'Missing VDS_HOST'; exit 1; }
          test -n "$VDS_USER" || { echo 'Missing VDS_USER'; exit 1; }
          test -n "$VDS_SSH_KEY" || { echo 'Missing VDS_SSH_KEY'; exit 1; }
          mkdir -p ~/.ssh; printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts
      - name: Deploy current repository files
        shell: bash
        env: { VDS_HOST: "${{ secrets.VDS_HOST }}", VDS_USER: "${{ secrets.VDS_USER }}" }
        run: |
          set -euo pipefail
          TARGET=/opt/sdelaet/current
          ssh "$VDS_USER@$VDS_HOST" "mkdir -p '$TARGET/assets/category-profiles' '$TARGET/docs/product/categories' '$TARGET/docs/product/agents' '$TARGET/tests'"
          rsync -az --checksum --exclude '.git/' --exclude '.github/' --exclude 'search-api/' ./ "$VDS_USER@$VDS_HOST:$TARGET/"
      - name: Production smoke check
        shell: bash
        env: { VDS_HOST: "${{ secrets.VDS_HOST }}", VDS_USER: "${{ secrets.VDS_USER }}" }
        run: |
          set -euo pipefail
          ssh "$VDS_USER@$VDS_HOST" "test -f /opt/sdelaet/current/assets/category-profiles/balcony-insulation.json && test -f /opt/sdelaet/current/assets/category-profiles/balcony-glazing.json && test -f /opt/sdelaet/current/assets/category-profiles/window-replacement.json && test -f /opt/sdelaet/current/assets/category-profiles/window-repair.json && test -f /opt/sdelaet/current/assets/category-profiles/balcony-finishing.json && test -f /opt/sdelaet/current/assets/category-profiles/balcony-leak-repair.json && test -f /opt/sdelaet/current/tests/seasonal-category-routing-regression.mjs && test -f /opt/sdelaet/current/tests/seasonal-expert-regression.mjs && grep -q 'sdExpertAgent' /opt/sdelaet/current/assets/launch-v2.js"
          echo 'FirstVDS deploy smoke check passed'