name: Deploy site to FirstVDS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.html','assets/**','tests/**','docs/product/**','.github/workflows/deploy-site-vds.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/category-engine.js assets/expert-agent.js assets/offer-parser.js assets/offer-followup.js assets/offer-merge.js assets/offer-normalizer.js assets/recommendation-status.js assets/recommendation-actions.js assets/comparison-explainer.js assets/launch-v2.js search-api/core.mjs; do node --check "$f"; done
          node tests/category-lifecycle-regression.mjs
          node tests/category-system-audit-regression.mjs
          node tests/category-agent-pipeline-regression.mjs
          node tests/category-create-command-regression.mjs
          node tests/category-generated-registry-regression.mjs
          node tests/category-regression-manifest.mjs
          node tools/category-agents/run.mjs --all --ci
          node tests/production-category-wiring-regression.mjs
          node tests/search-qualification-regression.mjs
          node tests/seasonal-category-routing-regression.mjs
          node tests/seasonal-expert-regression.mjs
          node tests/offer-parser-regression.mjs
          node tests/offer-followup-regression.mjs
          node tests/offer-merge-regression.mjs
          node tests/balcony-offer-normalizer-regression.mjs
          node tests/recommendation-status-regression.mjs
          node tests/recommendation-actions-regression.mjs
          node tests/comparison-explainer-regression.mjs
      - name: Prepare SSH
        shell: bash
        env: { VDS_HOST: "${{ secrets.VDS_HOST }}", VDS_USER: "${{ secrets.VDS_USER }}", VDS_SSH_KEY: "${{ secrets.VDS_SSH_KEY }}" }
        run: |
          set -euo pipefail
          test -n "$VDS_HOST" || { echo 'Missing VDS_HOST'; exit 1; }
          test -n "$VDS_USER" || { echo 'Missing VDS_USER'; exit 1; }
          test -n "$VDS_SSH_KEY" || { echo 'Missing VDS_SSH_KEY'; exit 1; }
          mkdir -p ~/.ssh; printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts
      - name: Deploy current repository files
        shell: bash
        env: { VDS_HOST: "${{ secrets.VDS_HOST }}", VDS_USER: "${{ secrets.VDS_USER }}" }
        run: |
          set -euo pipefail
          TARGET=/opt/sdelaet/current
          ssh "$VDS_USER@$VDS_HOST" "mkdir -p '$TARGET/assets/category-profiles' '$TARGET/docs/product/categories' '$TARGET/docs/product/agents' '$TARGET/docs/product/EXPERT_MODELS' '$TARGET/tests'"
          rsync -az --checksum --exclude '.git/' --exclude '.github/' --exclude 'search-api/' ./ "$VDS_USER@$VDS_HOST:$TARGET/"
      - name: Production smoke check
        shell: bash
        env: { VDS_HOST: "${{ secrets.VDS_HOST }}", VDS_USER: "${{ secrets.VDS_USER }}" }
        run: |
          set -euo pipefail
          ssh "$VDS_USER@$VDS_HOST" "cd /opt/sdelaet/current && node tools/category-agents/production-smoke.mjs"
          echo 'FirstVDS deploy smoke check passed'
