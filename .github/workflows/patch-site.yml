# final repaired payload publish 2026-09-06 23:18 MSK
name: Publish final v14
on:
  push:
    paths: ['.github/workflows/patch-site.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode pages
        shell: bash
        run: |
          set -euo pipefail
          echo 'decode create-task'
          cat .github/payload/create-task.1.b64 .github/payload/create-task.2.b64 | base64 -d | gzip -d > create-task.html
          echo 'decode task-tz'
          cat .github/payload/task-tz.1.b64 .github/payload/task-tz.2.b64 | base64 -d | gzip -d > task-tz.html
          echo 'decode candidates'
          base64 -d .github/payload/candidates.html.gz.b64 | gzip -d > candidates.html
          echo 'decode requests'
          base64 -d .github/payload/requests.html.gz.b64 | gzip -d > requests.html
          echo 'decode replies'
          base64 -d .github/payload/replies.html.gz.b64 | gzip -d > replies.html
          echo 'decode compare'
          cat .github/payload/compare.1.b64 .github/payload/compare.2.b64 | base64 -d | gzip -d > compare.html
          echo 'decode work'
          cat .github/payload/work.1.b64 .github/payload/work.2.b64 | base64 -d | gzip -d > work.html
          echo 'decode review'
          cat .github/payload/review.1.b64 .github/payload/review.2.b64 | base64 -d | gzip -d > review.html
          echo 'decode landing partial'
          base64 -d .github/payload/home-task-example.html.gz.b64 | gzip -d > /tmp/home.html
          test "$(wc -c < create-task.html)" -eq 23395
          test "$(wc -c < task-tz.html)" -eq 19672
          test "$(wc -c < candidates.html)" -eq 16676
          test "$(wc -c < requests.html)" -eq 16152
          test "$(wc -c < replies.html)" -eq 14766
          test "$(wc -c < compare.html)" -eq 15245
          test "$(wc -c < work.html)" -eq 15492
          test "$(wc -c < review.html)" -eq 15072
      - name: Patch landing and validate flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); h=Path('/tmp/home.html').read_text(encoding='utf-8')
          sec=re.search(r'<section class="task-example container" id="demo">.*?</section>',h,re.S)
          if not sec: raise SystemExit('missing landing section')
          st=re.search(r'<style>(.*?)</style>',h,re.S)
          if st and 'tz-preview-card{' not in s:
              s=s.replace('</head>','<style>'+st.group(1)+'</style></head>',1)
          s,n=re.subn(r'<section class="task-example container" id="demo">.*?</section>',sec.group(0),s,count=1,flags=re.S)
          if n!=1: raise SystemExit('landing replace failed')
          s=s.replace('sdelaet_create_task_v04.html','create-task.html').replace('href="index.html"','href="/"').replace('http://onsdelaet.ru','https://onsdelaet.ru')
          p.write_text(s,encoding='utf-8')
          chain=[('create-task.html','task-tz.html'),('task-tz.html','candidates.html'),('candidates.html','requests.html'),('requests.html','replies.html'),('replies.html','compare.html'),('compare.html','work.html'),('work.html','review.html')]
          for a,b in chain:
              if f'href="{b}' not in Path(a).read_text(encoding='utf-8'):
                  raise SystemExit(f'missing link {a}->{b}')
          print('flow ok')
          PY
      - name: Commit site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html create-task.html task-tz.html candidates.html requests.html replies.html compare.html work.html review.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish complete client flow v14'
          git push
