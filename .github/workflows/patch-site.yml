name: Publish site v14 verified

on:
  push:
    paths:
      - '.github/workflows/patch-site.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode prepared pages
        shell: bash
        run: |
          set -euo pipefail
          for page in create-task task-tz candidates requests replies compare work review; do
            base64 -d ".github/payload/${page}.html.gz.b64" | gzip -d > "${page}.html"
            test -s "${page}.html"
          done
          base64 -d ".github/payload/home-task-example.html.gz.b64" | gzip -d > /tmp/home-task-example.html
          test -s /tmp/home-task-example.html

      - name: Patch landing and canonical links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          partial = Path('/tmp/home-task-example.html').read_text(encoding='utf-8')

          style = re.search(r'<style>(.*?)</style>', partial, re.S)
          section = re.search(r'<section class="task-example container" id="demo">.*?</section>', partial, re.S)
          if not section:
              raise SystemExit('landing demo section missing from payload')

          if style and 'tz-preview-card{' not in s:
              s = s.replace('</head>', '<style>' + style.group(1) + '</style>\n</head>', 1)

          s, count = re.subn(
              r'<section class="task-example container" id="demo">.*?</section>',
              section.group(0), s, count=1, flags=re.S
          )
          if count != 1:
              raise SystemExit(f'expected one landing demo block, got {count}')

          s = s.replace('sdelaet_create_task_v04.html', 'create-task.html')
          s = s.replace('href="index.html"', 'href="/"')
          s = s.replace('http://onsdelaet.ru', 'https://onsdelaet.ru')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate complete client flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {'index.html','create-task.html','task-tz.html','candidates.html','requests.html','replies.html','compare.html','work.html','review.html'}
          required = {
              'create-task.html':'task-tz.html',
              'task-tz.html':'candidates.html',
              'candidates.html':'requests.html',
              'requests.html':'replies.html',
              'replies.html':'compare.html',
              'compare.html':'work.html',
              'work.html':'review.html',
          }
          errors = []
          for name in pages:
              p = Path(name)
              if not p.exists() or p.stat().st_size < 100:
                  errors.append(f'missing or empty: {name}')
                  continue
              text = p.read_text(encoding='utf-8')
              for href in re.findall(r'href="([^"#?]+\.html)', text):
                  target = href.rsplit('/',1)[-1]
                  if target not in pages:
                      errors.append(f'{name} -> unknown {target}')
          for page, target in required.items():
              if f'href="{target}' not in Path(page).read_text(encoding='utf-8'):
                  errors.append(f'missing forward link: {page} -> {target}')
          if errors:
              raise SystemExit('Flow validation failed:\n' + '\n'.join(errors))
          print('Complete client flow validated')
          PY

      - name: Update readme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          start = s.find('## Текущий пользовательский путь')
          end = s.find('## Принципы первой версии')
          if start != -1 and end != -1 and end > start:
              block = '''## Текущий пользовательский путь\n\n1. Главная — `index.html`\n2. Создание задачи — `create-task.html`\n3. Техническое задание — `task-tz.html`\n4. Подборка исполнителей — `candidates.html`\n5. Запросы исполнителям — `requests.html`\n6. Ответы — `replies.html`\n7. Сравнение — `compare.html`\n8. Работа — `work.html`\n9. Отзыв — `review.html`\n\n'''
              p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          PY

      - name: Commit published site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html create-task.html task-tz.html candidates.html requests.html replies.html compare.html work.html review.html README.md
          if git diff --cached --quiet; then
            echo 'No page changes needed'
            exit 0
          fi
          git commit -m 'Publish complete client flow v14 verified'
          git push
