name: Publish complete client flow v15

on:
  push:
    paths:
      - '.github/workflows/patch-site.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack prepared pages
        shell: bash
        run: |
          base64 -d .github/site_patch_payload.b64 > /tmp/site_v15.tar.gz
          tar -xzf /tmp/site_v15.tar.gz

      - name: Update landing example and navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          snippet_path = Path('home-task-example.html')
          s = index.read_text(encoding='utf-8')
          snippet = snippet_path.read_text(encoding='utf-8')

          m = re.search(r'(<style>.*?</style>)(<section class="task-example container" id="demo">.*?</section>)', snippet, re.S)
          if not m:
              raise SystemExit('home task example payload is invalid')
          extra_css, new_section = m.groups()

          if 'tz-preview-card' not in s:
              s = s.replace('</head>', extra_css + '\n</head>', 1)

          s, count = re.subn(
              r'<section class="task-example container" id="demo">.*?</section>',
              new_section,
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('landing task example block not found')

          s = s.replace('href="index.html"', 'href="/"')
          s = s.replace('http://onsdelaet.ru', 'https://onsdelaet.ru')
          index.write_text(s, encoding='utf-8')
          snippet_path.unlink()
          PY

      - name: Update project readme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          start = s.find('## Текущий пользовательский путь')
          end = s.find('## Принципы первой версии')
          if start != -1 and end != -1 and end > start:
              flow = '''## Текущий пользовательский путь\n\n1. Главная — `index.html`\n2. Создание задачи — `create-task.html`\n3. Техническое задание — `task-tz.html`\n4. Подборка исполнителей — `candidates.html`\n5. Запросы исполнителям — `requests.html`\n6. Ответы — `replies.html`\n7. Сравнение — `compare.html`\n8. Работа — `work.html`\n9. Отзыв — `review.html`\n\n'''
              s = s[:start] + flow + s[end:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate internal page links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = {'index.html','create-task.html','task-tz.html','candidates.html','requests.html','replies.html','compare.html','work.html','review.html'}
          missing = []
          for name in pages:
              p = Path(name)
              if not p.exists():
                  missing.append(f'missing page: {name}')
                  continue
              text = p.read_text(encoding='utf-8')
              for href in re.findall(r'href="([^"#?]+\.html)', text):
                  href = href.rsplit('/',1)[-1]
                  if href not in pages:
                      missing.append(f'{name} -> {href}')
          if missing:
              raise SystemExit('Broken local links:\n' + '\n'.join(missing))
          print('All client-flow links are valid')
          PY

      - name: Commit published flow
        shell: bash
        run: |
          if git diff --quiet -- index.html create-task.html task-tz.html candidates.html requests.html replies.html compare.html work.html review.html README.md; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html create-task.html task-tz.html candidates.html requests.html replies.html compare.html work.html review.html README.md
          git commit -m 'Publish complete client flow v15'
          git push
