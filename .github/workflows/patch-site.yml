# Payloads verified and repaired 2026-09-06 23:00 MSK
name: Publish verified site v14

on:
  push:
    paths:
      - '.github/workflows/patch-site.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode verified pages
        shell: bash
        run: |
          set -euo pipefail
          echo 'decode create-task'
          cat .github/payload/create-task.1.b64 .github/payload/create-task.2.b64 | base64 -d | gzip -d > create-task.html
          echo 'decode task-tz'
          cat .github/payload/task-tz.1.b64 .github/payload/task-tz.2.b64 | base64 -d | gzip -d > task-tz.html
          echo 'decode candidates'
          base64 -d .github/payload/candidates.html.gz.b64 | gzip -d > candidates.html
          echo 'decode requests'
          base64 -d .github/payload/requests.html.gz.b64 | gzip -d > requests.html
          echo 'decode replies'
          base64 -d .github/payload/replies.html.gz.b64 | gzip -d > replies.html
          echo 'decode compare'
          base64 -d .github/payload/compare.html.gz.b64 | gzip -d > compare.html
          echo 'decode work'
          base64 -d .github/payload/work.html.gz.b64 | gzip -d > work.html
          echo 'decode review'
          cat .github/payload/review.1.b64 .github/payload/review.2.b64 | base64 -d | gzip -d > review.html
          echo 'decode landing partial'
          base64 -d .github/payload/home-task-example.html.gz.b64 | gzip -d > /tmp/home-task-example.html

          test "$(wc -c < create-task.html)" -eq 23395
          test "$(wc -c < task-tz.html)" -eq 19672
          test "$(wc -c < candidates.html)" -eq 16676
          test "$(wc -c < requests.html)" -eq 16152
          test "$(wc -c < replies.html)" -eq 14766
          test "$(wc -c < compare.html)" -eq 15245
          test "$(wc -c < work.html)" -eq 15492
          test "$(wc -c < review.html)" -eq 15072
          test "$(wc -c < /tmp/home-task-example.html)" -eq 9279

      - name: Update landing example
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          partial=Path('/tmp/home-task-example.html').read_text(encoding='utf-8')
          styles=re.findall(r'<style>(.*?)</style>', partial, re.S)
          section=re.search(r'<section class="task-example container" id="demo">.*?</section>', partial, re.S)
          if not section:
              raise SystemExit('landing demo section missing')
          if styles and 'tz-preview-card{' not in s:
              s=s.replace('</head>','<style>'+'\n'.join(styles)+'</style>\n</head>',1)
          s,count=re.subn(r'<section class="task-example container" id="demo">.*?</section>',section.group(0),s,count=1,flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one landing demo block, got {count}')
          s=s.replace('sdelaet_create_task_v04.html','create-task.html')
          s=s.replace('href="index.html"','href="/"')
          s=s.replace('http://onsdelaet.ru','https://onsdelaet.ru')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate complete client flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages={'index.html','create-task.html','task-tz.html','candidates.html','requests.html','replies.html','compare.html','work.html','review.html'}
          required={'create-task.html':'task-tz.html','task-tz.html':'candidates.html','candidates.html':'requests.html','requests.html':'replies.html','replies.html':'compare.html','compare.html':'work.html','work.html':'review.html'}
          errors=[]
          for name in pages:
              text=Path(name).read_text(encoding='utf-8')
              for href in re.findall(r'href="([^"#?]+\.html)',text):
                  target=href.rsplit('/',1)[-1]
                  if target not in pages:
                      errors.append(f'{name} -> unknown {target}')
          for page,target in required.items():
              if f'href="{target}' not in Path(page).read_text(encoding='utf-8'):
                  errors.append(f'missing forward link: {page} -> {target}')
          if errors:
              raise SystemExit('Flow validation failed:\n'+'\n'.join(errors))
          print('Complete client flow validated')
          PY

      - name: Commit published site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html create-task.html task-tz.html candidates.html requests.html replies.html compare.html work.html review.html
          if git diff --cached --quiet; then
            echo 'No page changes needed'
            exit 0
          fi
          git commit -m 'Publish complete client flow v14'
          git push
