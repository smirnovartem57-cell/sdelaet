name: Platform readiness
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'config/**'
      - 'docs/product/**'
      - 'search-api/**'
      - 'tests/**'
      - 'tools/category-agents/**'
      - 'tools/platform-readiness.mjs'
      - '.github/workflows/platform-readiness.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated launch-readiness gates
        run: node tools/platform-readiness.mjs
      - name: Validate canonical deploy shell syntax
        run: bash -n ops/sdelaet-deploy-main.sh
      - name: Validate canonical deploy contract
        run: node tests/deploy-path-regression.mjs
      - name: Validate Search API deploy contract
        run: node tests/search-api-deploy-regression.mjs

  recover-search-api:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'smirnovartem57-cell' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.title == 'RECOVERY: deploy Search API runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_USER: ${{ secrets.VDS_USER }}
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate recovery secrets
        run: |
          set -euo pipefail
          for name in VDS_HOST VDS_USER VDS_SSH_KEY; do test -n "${!name:-}" || { echo "Missing repository secret: $name"; exit 1; }; done
      - name: Recover exact Search API runtime
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts
          tar -czf /tmp/search-api.tgz search-api
          scp -q /tmp/search-api.tgz "$VDS_USER@$VDS_HOST:/tmp/sdelaet-search-api-$SOURCE_SHA.tgz"
          ssh "$VDS_USER@$VDS_HOST" "EXPECTED_SHA='$SOURCE_SHA' ARCHIVE='/tmp/sdelaet-search-api-$SOURCE_SHA.tgz' bash -s" <<'REMOTE'
          set -euo pipefail
          TARGET=/opt/sdelaet/search-api
          STATE=/var/lib/sdelaet/deploy/search-api.sha
          BACKUPS=/opt/sdelaet/backups/search-api
          SERVICE=sdelaet-search-api.service
          ENV_FILE=/etc/sdelaet/search-api.env
          mkdir -p "$TARGET" "$BACKUPS" "$(dirname "$STATE")"
          test -f "$ENV_FILE" || { echo SEARCH_API_ENV_MISSING; exit 1; }
          systemctl cat "$SERVICE" >/dev/null
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$BACKUPS/$stamp"
          cp -a "$TARGET/." "$BACKUPS/$stamp/" 2>/dev/null || true
          tmp="$(mktemp -d /opt/sdelaet/search-api-new.XXXXXX)"
          trap 'rm -rf "$tmp"; rm -f "$ARCHIVE"' EXIT
          tar -xzf "$ARCHIVE" -C "$tmp"
          rsync -a --delete "$tmp/search-api/" "$TARGET/"
          printf '%s\n' "$EXPECTED_SHA" > "$TARGET/.deploy-sha"
          systemctl restart "$SERVICE"
          for attempt in $(seq 1 20); do
            if systemctl is-active --quiet "$SERVICE" && curl -fsS --max-time 2 http://127.0.0.1:8788/health >/tmp/search-health.json; then break; fi
            sleep 1
          done
          systemctl is-active --quiet "$SERVICE"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/search-health.json'))
          assert d.get('ok') is True,d
          assert d.get('providers',{}).get('yandexSearch') is True,d
          print(d)
          PY
          printf '%s\n' "$EXPECTED_SHA" > "$STATE"
          REMOTE
      - name: Live candidate smoke
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-delay 2 -X POST https://api.onsdelaet.ru/v1/candidates/search -H 'content-type: application/json' --data '{"categoryId":"balcony-insulation","city":"Мытищи","description":"Нужно утеплить балкон","executorPreference":"any","limit":5}')"
          printf '%s' "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True,d; assert d.get('count',0)>0,d; print('count=',d.get('count'))"

  diagnose-search-api:
    if: github.event_name == 'pull_request' && github.event.pull_request.title == 'RECOVERY: deploy Search API runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public Search API health
        run: |
          set -euo pipefail
          curl -i -sS --max-time 15 https://api.onsdelaet.ru/health
      - name: Public candidate search smoke
        run: |
          set -euo pipefail
          curl -i -sS --max-time 30 -X POST https://api.onsdelaet.ru/v1/candidates/search -H 'content-type: application/json' --data '{"categoryId":"balcony-insulation","city":"Мытищи","description":"Нужно утеплить балкон","executorPreference":"any","limit":5}'
