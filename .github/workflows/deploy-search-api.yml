name: Configure OpenAI for Sdelaet API on FirstVDS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-search-api.yml'

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository secrets
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in VDS_HOST VDS_USER VDS_SSH_KEY OPENAI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Prepare SSH
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts

      - name: Configure OpenAI secret on FirstVDS
        shell: bash
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          local_key_file="$(mktemp)"
          remote_key_file="$(ssh "$VDS_USER@$VDS_HOST" 'mktemp /tmp/sdelaet-openai-key.XXXXXX')"
          trap 'rm -f "$local_key_file"; ssh "$VDS_USER@$VDS_HOST" "rm -f '"'"'$remote_key_file'"'"'" >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$OPENAI_API_KEY" > "$local_key_file"
          chmod 600 "$local_key_file"
          scp -q "$local_key_file" "$VDS_USER@$VDS_HOST:$remote_key_file"

          ssh "$VDS_USER@$VDS_HOST" "REMOTE_KEY_FILE='$remote_key_file' bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE=/etc/sdelaet/api.env
          SERVICE=sdelaet-api.service

          test "$(id -u)" -eq 0 || { echo 'VDS_USER must have root access'; exit 1; }
          test -f "$ENV_FILE" || { echo "Missing $ENV_FILE"; exit 1; }
          test -f "$REMOTE_KEY_FILE" || { echo 'Temporary OpenAI key file is missing'; exit 1; }
          systemctl cat "$SERVICE" >/dev/null

          IFS= read -r openai_key < "$REMOTE_KEY_FILE"
          rm -f "$REMOTE_KEY_FILE"
          test -n "$openai_key" || { echo 'OPENAI_API_KEY is empty'; exit 1; }

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$ENV_FILE" "${ENV_FILE}.bak-${stamp}"

          tmp="$(mktemp /etc/sdelaet/api.env.XXXXXX)"
          trap 'rm -f "$tmp"' EXIT
          awk '!/^OPENAI_API_KEY=/' "$ENV_FILE" > "$tmp"
          printf 'OPENAI_API_KEY=%s\n' "$openai_key" >> "$tmp"
          chown --reference="$ENV_FILE" "$tmp"
          chmod --reference="$ENV_FILE" "$tmp"
          mv "$tmp" "$ENV_FILE"
          trap - EXIT

          systemctl restart "$SERVICE"
          systemctl is-active --quiet "$SERVICE"

          pid="$(systemctl show "$SERVICE" -p MainPID --value)"
          test "$pid" -gt 0
          tr '\0' '\n' < "/proc/$pid/environ" | grep -q '^OPENAI_API_KEY='
          echo 'OPENAI_API_KEY is loaded by sdelaet-api.service'
          REMOTE
          rm -f "$local_key_file"
          trap - EXIT

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 5 --retry-delay 2 https://api.onsdelaet.ru/health)"
          printf '%s' "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True,d; assert d.get('database')=='ok',d; assert d.get('providers',{}).get('yandexSearch') is True,d; print(d)"
