name: Deploy live contractor search API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID YANDEX_SEARCH_API_KEY YANDEX_FOLDER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Validate JavaScript
        run: |
          node --check search-api/core.mjs
          node --check search-api/worker.js
          node --check assets/live-search.js

      - name: Create worker shell
        working-directory: search-api
        run: npx --yes wrangler@4 deploy

      - name: Configure provider secrets
        working-directory: search-api
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$YANDEX_SEARCH_API_KEY" | npx --yes wrangler@4 secret put YANDEX_SEARCH_API_KEY
          printf '%s' "$YANDEX_FOLDER_ID" | npx --yes wrangler@4 secret put YANDEX_FOLDER_ID
          if [ -n "${DGIS_API_KEY:-}" ]; then
            printf '%s' "$DGIS_API_KEY" | npx --yes wrangler@4 secret put DGIS_API_KEY
          fi

      - name: Deploy configured worker
        working-directory: search-api
        run: npx --yes wrangler@4 deploy

      - name: Resolve worker URL and smoke test
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(printf '%s' "$json" | python -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")"
          if [ -z "$subdomain" ]; then
            echo "Could not resolve workers.dev subdomain"
            exit 1
          fi
          worker_url="https://sdelaet-search-api.${subdomain}.workers.dev"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Search API: $worker_url"
          curl -fsS "$worker_url/health" | python -m json.tool

      - name: Connect production frontend to worker
        shell: bash
        env:
          WORKER_URL: ${{ steps.endpoint.outputs.worker_url }}
        run: |
          set -euo pipefail
          printf "window.SDELAET_SEARCH_API='%s/v1/candidates/search';\n" "$WORKER_URL" > assets/search-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/search-config.js
          if ! git diff --cached --quiet; then
            git commit -m "Connect live contractor search API"
            git push
          fi

      - name: Live search smoke test
        shell: bash
        env:
          WORKER_URL: ${{ steps.endpoint.outputs.worker_url }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "$WORKER_URL/v1/candidates/search" \
            -H 'content-type: application/json' \
            --data '{"categoryId":"balcony-insulation","category":"Утепление / отделка балкона","city":"Мытищи","description":"Нужно утеплить стену балкона вокруг окна","scope":"Одна стена балкона","executorPreference":"any","limit":5}')"
          printf '%s' "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d; print('count=', d.get('count')); print('providers=', d.get('providers')); print('candidates=', [x.get('name') for x in d.get('candidates', [])])"
