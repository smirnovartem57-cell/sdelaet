name: Deploy live contractor search API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID YANDEX_SEARCH_API_KEY YANDEX_FOLDER_ID OPENAI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Validate JavaScript
        run: |
          node --check search-api/core.mjs
          node --check search-api/expert.mjs
          node --check search-api/worker.js
          node --check assets/live-search.js
          node --check assets/ai-expert.js
          node --check assets/expert-agent.js

      - name: Create worker shell
        working-directory: search-api
        run: npx --yes wrangler@4 deploy

      - name: Configure provider secrets
        working-directory: search-api
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$YANDEX_SEARCH_API_KEY" | npx --yes wrangler@4 secret put YANDEX_SEARCH_API_KEY
          printf '%s' "$YANDEX_FOLDER_ID" | npx --yes wrangler@4 secret put YANDEX_FOLDER_ID
          printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY
          printf '%s' "$OPENAI_MODEL" | npx --yes wrangler@4 secret put OPENAI_MODEL
          if [ -n "${DGIS_API_KEY:-}" ]; then
            printf '%s' "$DGIS_API_KEY" | npx --yes wrangler@4 secret put DGIS_API_KEY
          fi

      - name: Deploy configured worker
        working-directory: search-api
        run: npx --yes wrangler@4 deploy

      - name: Resolve worker URL and health check
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(printf '%s' "$json" | python -c "import json,sys; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")"
          test -n "$subdomain"
          worker_url="https://sdelaet-search-api.${subdomain}.workers.dev"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          curl -fsS "$worker_url/health" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok'); assert d.get('providers',{}).get('openai') is True; print(d)"

      - name: LLM expert smoke test
        shell: bash
        env:
          WORKER_URL: ${{ steps.endpoint.outputs.worker_url }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "$WORKER_URL/v1/expert/construction/analyze" -H 'content-type: application/json' --data '{"task":{"serviceCode":"BALCONY_INSULATION","description":"Хочу утеплить лоджию под кабинет, пользоваться зимой. Остекление уже есть, иногда появляется конденсат.","city":"Мытищи","goal":"Кабинет / использование зимой","window":"Остекление есть — сохранить","currentState":"Есть сырость / конденсат / промерзание","wallSize":"3,1 × 1,1 м"}}')"
          printf '%s' "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True,d; e=d.get('expert') or {}; assert e.get('serviceCode')=='BALCONY_INSULATION',d; assert isinstance(e.get('technicalRisks'),list),d; assert e.get('contractorBrief'),d; print('model=',d.get('model')); print('risks=',len(e.get('technicalRisks',[])))"

      - name: Live search smoke test
        shell: bash
        env:
          WORKER_URL: ${{ steps.endpoint.outputs.worker_url }}
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST "$WORKER_URL/v1/candidates/search" -H 'content-type: application/json' --data '{"categoryId":"balcony-insulation","category":"Утепление / отделка балкона","city":"Мытищи","description":"Нужно утеплить стену балкона вокруг окна","scope":"Одна стена балкона","executorPreference":"any","limit":5}')"
          printf '%s' "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True,d; assert d.get('count',0)>0,d; print('count=',d.get('count'))"

      - name: Connect production frontend to worker
        shell: bash
        env:
          WORKER_URL: ${{ steps.endpoint.outputs.worker_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          from pathlib import Path
          worker=os.environ['WORKER_URL']
          path=Path('assets/live-search.js'); text=path.read_text(encoding='utf-8')
          text,n=re.subn(r"const API_URL=window\.SDELAET_SEARCH_API\|\|'https://[^']+/v1/candidates/search';", "const API_URL=window.SDELAET_SEARCH_API||'"+worker+"/v1/candidates/search';", text, count=1)
          if n!=1: raise SystemExit('Could not locate API_URL')
          path.write_text(text,encoding='utf-8')
          Path('assets/search-config.js').write_text("window.SDELAET_SEARCH_API='"+worker+"/v1/candidates/search';\nwindow.SDELAET_API_BASE='"+worker+"';\nwindow.SDELAET_OUTREACH_EMAIL_ENABLED=false;\n",encoding='utf-8')
          PY
          node --check assets/live-search.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-search.js assets/search-config.js
          if ! git diff --cached --quiet; then
            git commit -m "Connect live search and expert API"
            git push
          fi
