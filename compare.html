<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сравнение предложений — Сделает</title><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script><script src="assets/recommendation-status.js"></script><script src="assets/comparison-explainer.js"></script><style>.compare-grid{display:grid;gap:14px}.compare-card{border:1px solid var(--line);border-radius:20px;padding:18px;background:#fff}.compare-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.price{font:900 28px Montserrat,Roboto,sans-serif}.muted{color:var(--muted);font-size:12px}.facts{display:grid;gap:7px;margin-top:12px}.fact{padding:9px 11px;border-radius:12px;background:#f8faff;font-size:12px}.warn{background:#fff8ea;border:1px solid #ecd7a3}.good{background:#effbf5;border:1px solid #cfeadf}.risk{background:#fff0f0;border:1px solid #efcaca}.score{font:800 12px Montserrat}.empty{padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.decision{margin-bottom:16px;border:1px solid #cfdcf7;background:#f7f9ff}.decision h2{margin:4px 0 8px}.decision-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.decision-block{padding:14px;border-radius:16px;background:#fff}.decision-block b{display:block;margin-bottom:7px}.decision-line{font-size:13px;margin-top:6px}.rec-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font:800 11px Montserrat,Roboto,sans-serif;margin-top:6px}.rec-RECOMMENDED{background:#eaf8f0;color:#17643a}.rec-GOOD_ALTERNATIVE{background:#eef4ff;color:#2556a6}.rec-NEEDS_CLARIFICATION{background:#fff6df;color:#8a5a00}.rec-NOT_COMPARABLE{background:#f1f2f6;color:#596176}.rec-HIGH_RISK{background:#ffecec;color:#9c2525}@media(max-width:760px){.decision-grid{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><div>Сдела<span>ет</span></div></a><nav class="app-nav"><a href="my-tasks.html">▤ Мои задачи</a><a href="create-task.html">＋ Новая задача</a></nav></aside><main class="app-main"><div class="app-content"><div class="page"><section class="card"><div class="eyebrow">Сравнение</div><h1 class="hero-title">Предложения приведены к единому виду</h1><p class="lead">Сравниваем не только цифру, а полноту сметы, материалы, исключения и возможные доплаты.</p><div id="decision"></div><div id="list" class="compare-grid"></div><div class="actions"><a class="btn secondary" href="replies.html">← Изменить ответы</a></div></section></div></div></main></div><script>
(function(){var list=document.getElementById('list'),decision=document.getElementById('decision'),offers=[],task=sdGetTask?sdGetTask():{};try{offers=JSON.parse(localStorage.getItem('sdelaet.offers.normalized.v1')||'[]')}catch(e){}if(!offers.length){list.innerHTML='<div class="empty">Пока нет нормализованных предложений. Сначала добавьте ответы исполнителей.</div>';return}offers=window.sdRecommendationStatus?sdRecommendationStatus.assign(offers,task):offers;localStorage.setItem('sdelaet.offers.recommendations.v1',JSON.stringify(offers));var insight=window.sdComparisonExplainer?sdComparisonExplainer.explain(offers,task):null;if(insight){var d=document.createElement('div');d.className='compare-card decision';d.innerHTML='<div class="eyebrow">Вывод «Сделает»</div><h2>'+(insight.winner?'Почему этот вариант выглядит выгоднее':'Пока рано выбирать победителя')+'</h2><div class="muted">'+insight.summary+'</div><div class="decision-grid"><div class="decision-block"><b>Почему</b>'+((insight.reasons||[]).length?insight.reasons.map(function(x){return'<div class="decision-line">• '+x+'</div>'}).join(''):'<div class="decision-line">• Недостаточно данных для обоснованного выбора.</div>')+'</div><div class="decision-block"><b>Проверить перед выбором</b>'+((insight.checks||[]).map(function(x){return'<div class="decision-line">• '+x+'</div>'}).join(''))+'</div></div>';decision.appendChild(d)}offers.forEach(function(o){var c=document.createElement('div');c.className='compare-card';var price=o.comparableTotalPrice!=null?o.comparableTotalPrice.toLocaleString('ru-RU')+' ₽':'Нельзя сравнить';var status=o.recommendationStatus||'NEEDS_CLARIFICATION';var badge=window.sdRecommendationStatus?sdRecommendationStatus.label(status):status;c.innerHTML='<div class="compare-head"><div><div class="eyebrow">'+(o.comparable?'Сопоставимое предложение':'Предложение требует проверки')+'</div><h2 style="margin:3px 0">'+(o.candidateName||'Исполнитель')+'</h2><div class="rec-badge rec-'+status+'">'+badge+'</div><div class="muted" style="margin-top:6px">'+(o.recommendationReason||'')+'</div><div class="muted" style="margin-top:6px">Полнота: <span class="score">'+o.completenessScore+'%</span></div></div><div class="price">'+price+'</div></div><div class="facts"><div class="fact '+(o.materialsIncluded===true?'good':o.materialsIncluded===false?'warn':'')+'">Материалы: '+(o.materialsIncluded===true?'включены':o.materialsIncluded===false?'отдельно':'не указано')+'</div><div class="fact">Срок: '+(o.leadTime||'не указан')+'</div><div class="fact">Гарантия: '+(o.warranty||'не указана')+'</div></div>';var facts=c.querySelector('.facts');(o.missingCriticalWorks||[]).forEach(function(x){var d=document.createElement('div');d.className='fact warn';d.textContent='Не подтверждено: '+x;facts.appendChild(d)});(o.gaps||[]).forEach(function(x){var d=document.createElement('div');d.className='fact warn';d.textContent=x;facts.appendChild(d)});(o.flags||[]).forEach(function(x){var d=document.createElement('div');d.className='fact '+(status==='HIGH_RISK'?'risk':'warn');d.textContent=x;facts.appendChild(d)});if(o.explanation){var d=document.createElement('div');d.className='fact good';d.textContent=o.explanation;facts.appendChild(d)};list.appendChild(c)})})();
</script></body></html>
