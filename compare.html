<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сравнение предложений — Сделает</title><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script><style>.compare-grid{display:grid;gap:14px}.compare-card{border:1px solid var(--line);border-radius:20px;padding:18px;background:#fff}.compare-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.price{font:900 28px Montserrat,Roboto,sans-serif}.muted{color:var(--muted);font-size:12px}.facts{display:grid;gap:7px;margin-top:12px}.fact{padding:9px 11px;border-radius:12px;background:#f8faff;font-size:12px}.warn{background:#fff8ea;border:1px solid #ecd7a3}.good{background:#effbf5;border:1px solid #cfeadf}.score{font:800 12px Montserrat}.empty{padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}</style></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><div>Сдела<span>ет</span></div></a><nav class="app-nav"><a href="my-tasks.html">▤ Мои задачи</a><a href="create-task.html">＋ Новая задача</a></nav></aside><main class="app-main"><div class="app-content"><div class="page"><section class="card"><div class="eyebrow">Сравнение</div><h1 class="hero-title">Предложения приведены к единому виду</h1><p class="lead">Сравниваем не только цифру, а полноту сметы, материалы, исключения и возможные доплаты.</p><div id="list" class="compare-grid"></div><div class="actions"><a class="btn secondary" href="replies.html">← Изменить ответы</a></div></section></div></div></main></div><script>
(function(){var list=document.getElementById('list'),offers=[];try{offers=JSON.parse(localStorage.getItem('sdelaet.offers.normalized.v1')||'[]')}catch(e){}if(!offers.length){list.innerHTML='<div class="empty">Пока нет нормализованных предложений. Сначала добавьте ответы исполнителей.</div>';return}var bestIndex=offers.findIndex(function(x){return x.comparable&&x.comparableTotalPrice!=null});offers.forEach(function(o,i){var c=document.createElement('div');c.className='compare-card';var price=o.comparableTotalPrice!=null?o.comparableTotalPrice.toLocaleString('ru-RU')+' ₽':'Нельзя сравнить';var eyebrow=i===bestIndex?'Лучший сопоставимый вариант':(o.comparable?'Сопоставимое предложение':'Нужно уточнить');c.innerHTML='<div class="compare-head"><div><div class="eyebrow">'+eyebrow+'</div><h2 style="margin:3px 0">'+(o.candidateName||'Исполнитель')+'</h2><div class="muted">Полнота: <span class="score">'+o.completenessScore+'%</span></div></div><div class="price">'+price+'</div></div><div class="facts"><div class="fact '+(o.materialsIncluded===true?'good':o.materialsIncluded===false?'warn':'')+'">Материалы: '+(o.materialsIncluded===true?'включены':o.materialsIncluded===false?'отдельно':'не указано')+'</div><div class="fact">Срок: '+(o.leadTime||'не указан')+'</div><div class="fact">Гарантия: '+(o.warranty||'не указана')+'</div></div>';
var facts=c.querySelector('.facts');(o.missingCriticalWorks||[]).forEach(function(x){var d=document.createElement('div');d.className='fact warn';d.textContent='Не подтверждено: '+x;facts.appendChild(d)});(o.gaps||[]).forEach(function(x){var d=document.createElement('div');d.className='fact warn';d.textContent=x;facts.appendChild(d)});(o.flags||[]).forEach(function(x){var d=document.createElement('div');d.className='fact warn';d.textContent=x;facts.appendChild(d)});if(o.explanation){var d=document.createElement('div');d.className='fact good';d.textContent=o.explanation;facts.appendChild(d)};list.appendChild(c)})})();
</script></body></html>
