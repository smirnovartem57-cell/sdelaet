<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Оплата — Сделает</title><link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script>
<style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.payment-result{width:min(680px,100%);padding:32px}.payment-mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--bg);color:var(--green);font:900 28px Montserrat;margin-bottom:18px}.payment-result h1{font:900 clamp(28px,5vw,42px)/1.05 Montserrat;margin:0 0 12px}.payment-result p{color:var(--muted);font-size:16px;line-height:1.55}.status-line{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-weight:700}.actions{margin-top:20px}</style></head>
<body><main class="card payment-result"><div class="payment-mark">✓</div><div class="eyebrow">Оплата</div><h1 id="title">Проверяем оплату</h1><p id="lead">Это обычно занимает несколько секунд.</p><div class="status-line" id="status">Получаем статус заказа…</div><div class="actions"><a class="btn primary large hidden" id="continueBtn" href="candidates.html">Перейти к подбору →</a><button class="btn secondary" id="retryBtn" type="button">Проверить ещё раз</button></div></main>
<script>
const order=new URLSearchParams(location.search).get('order')||'';if(window.sdAnalytics)sdAnalytics.paymentReturn({order_id:order,result_page:'success'});let paymentSuccessTracked=false;const title=document.getElementById('title'),lead=document.getElementById('lead'),status=document.getElementById('status'),go=document.getElementById('continueBtn'),retry=document.getElementById('retryBtn');
async function check(){retry.disabled=true;status.textContent='Проверяем статус…';try{const r=await fetch('/api/payments/v1/payments/'+encodeURIComponent(order));const d=await r.json();const s=d?.order?.status||'';if(s==='paid'){if(!paymentSuccessTracked&&window.sdAnalytics){sdAnalytics.paymentStatus(s,{order_id:order});paymentSuccessTracked=true}var pending={};try{pending=JSON.parse(localStorage.getItem('sdelaet.payment.pending')||'{}')}catch(e){}var tariffName=pending.tariffId==='choice'?'До выбора':'Подбор';if(pending.orderId===order){localStorage.setItem('sdelaet.payment.active.v1',JSON.stringify({orderId:order,taskId:pending.taskId||'',tariffId:pending.tariffId||'',amount:pending.amount||0,paidAt:new Date().toISOString()}));var task=window.sdGetTask?sdGetTask():null;if(task&&(!pending.taskId||task.id===pending.taskId)){task.paidOrderId=order;task.tariffId=pending.tariffId||task.tariffId||'';sdSetTask(task)}}title.textContent='Оплата получена';lead.textContent='Тариф «'+tariffName+'» активирован.';status.textContent='Подбор готов — переходим к кандидатам…';go.textContent='Перейти к кандидатам →';go.classList.remove('hidden');retry.classList.add('hidden');setTimeout(function(){location.replace('candidates.html')},1600);return}title.textContent='Оплата обрабатывается';lead.textContent='Банк подтвердил переход, но статус заказа ещё обновляется.';status.textContent='Подождите несколько секунд и проверьте ещё раз.'}catch(e){status.textContent='Не удалось получить статус. Попробуйте ещё раз.'}retry.disabled=false}
retry.onclick=check;if(order){check();setTimeout(check,2500)}else{title.textContent='Не найден номер заказа';lead.textContent='Вернитесь к заданию и повторите оплату.';status.textContent='Номер заказа отсутствует.';retry.classList.add('hidden')}
</script></body></html>
