# Conservative public security headers for onsdelaet.ru.
# Intentionally no enforced CSP yet: the current product uses inline scripts,
# Yandex.Metrika and payment integrations that require a dedicated CSP rollout.

add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), microphone=()" always;

# Deployment:
# include this file inside the HTTPS server block for onsdelaet.ru,
# then run `nginx -t` before reload.
