<body class="account-body">
<div class="account-shell">
<aside class="account-sidebar">
 <a class="account-brand" href="/"><img src="assets/logo-icon.svg" alt=""><strong>Сдела<span>ет</span></strong></a>
 <nav class="account-nav"><a class="active" href="my-tasks.html">Мои задачи</a><a href="profile.html">Профиль</a></nav>
 <div class="account-sidebar-bottom"><a href="/">На главную</a><button type="button" data-account-logout>Выйти</button></div>
</aside>
<main class="account-main">
 <header class="account-topbar"><a class="account-topbar-brand" href="/"><img src="assets/logo-icon.svg" alt=""><strong>Сдела<span>ет</span></strong></a><div class="account-topbar-actions"><span class="account-user" data-account-email></span><a class="account-secondary" href="my-tasks.html">Все задачи</a></div></header>
 <div class="account-content" id="taskRoot"><div class="account-loading">Загружаем задачу…</div></div>
</main>

<script>
document.addEventListener('DOMContentLoaded',async function(){
 var root=document.getElementById('taskRoot'),id=new URLSearchParams(location.search).get('task'),viewEvents=new Set(),selectedCandidateIds=new Set(),workspaceController=null;
 function trackWorkspaceOnce(name,params){var key=name+':'+id;if(!viewEvents.has(key)){viewEvents.add(key);sdAccount.track(name,params);}}
 if(!id){location.replace('/my-tasks.html');return}
 try{
  await sdAccount.requireAuth();
  var d=await sdAccount.api('/v1/account/tasks/'+encodeURIComponent(id)),t=d.task;
  render(t);
  if(t.research&&!(t.payment&&t.payment.status==='paid'))sdJourney.resumeCheckout({taskId:t.taskId,task:t,research:t.research,pricing:t.pricing,title:t.title,region:t.region}).catch(function(){});
 }catch(e){
  if(e.message==='AUTH_REQUIRED')return;
  if(e.message==='TASK_NOT_FOUND'){root.innerHTML='<div class="account-error">Задача не найдена или недоступна этому аккаунту. <a href="my-tasks.html">Вернуться в «Мои задачи»</a></div>';return}
  root.innerHTML='<div class="account-error">Не удалось загрузить задачу. Попробуйте обновить страницу.</div>';
 }
 function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function list(v){return Array.isArray(v)?v.filter(Boolean):[]}
 function taskAttachments(t){
  var j=t.taskJson||{},items=Array.isArray(j.attachments)?j.attachments:[];
  return items.filter(function(x){return x&&(/^image\//i.test(String(x.type||''))||x.data)});
 }
 function contactPreference(t){
  try{return JSON.parse(localStorage.getItem('sdelaet.contact-sharing.'+t.taskId)||'null')||{mode:'service',fields:[]}}catch(e){return{mode:'service',fields:[]}}
 }
 function taskStatusRail(t){
  var counts=t.counts||{},payment=t.payment||{},attachments=taskAttachments(t),pref=contactPreference(t),sent=Number(counts.outreach||0),replies=Number(counts.replies||0),offers=Number(counts.offers||0);
  return '<aside class="task-status-rail compact" aria-label="Состояние задачи">'+
   '<div class="task-rail-top"><div><span>Задача</span><b>'+esc(t.title)+'</b></div><i class="task-rail-state">'+esc(t.status&&t.status.label||'В работе')+'</i></div>'+
   '<div class="task-rail-metrics"><a href="#responses"><b>'+sent+'</b><small>отправлено</small></a><a href="#responses"><b>'+replies+'</b><small>ответов</small></a><a href="#comparison"><b>'+offers+'</b><small>предложений</small></a></div>'+
   '<div class="task-rail-facts">'+
    '<a href="#task-attachments"><span>📎 Вложения</span><b>'+attachments.length+' фото</b></a>'+
    '<div><span>Связь</span><b>'+(pref.mode==='direct'?'Контакты передаются':'Ответы через «Сделает»')+'</b></div>'+
    (payment.status?'<a href="#payment"><span>Оплата</span><b>'+esc(payment.planName||'Подбор')+' · '+esc(sdAccount.money(payment.amount))+'</b><small>'+esc(sdJourney.paymentLabel(payment.status))+'</small></a>':'')+
   '</div>'+
   '<nav><a href="#selection">Исполнители</a><a href="#responses">Ответы</a><a href="#comparison">Сравнение</a></nav>'+
  '</aside>';
 }
 function sectionDivider(step,title,note){
  return '<div class="task-stage-divider"><span>'+esc(step)+'</span><div><b>'+esc(title)+'</b><small>'+esc(note||'')+'</small></div></div>';
 }
 function taskAttachmentsBlock(t){
  var items=taskAttachments(t);
  if(!items.length)return '<div class="task-attachments-empty" id="task-attachments"><b>Вложения</b><span>Фото к задаче не приложены.</span></div>';
  return '<div class="task-attachments-block" id="task-attachments"><div><b>Фото и файлы · '+items.length+' приложено</b><span>Эти вложения будут показаны перед отправкой и приложены к Email.</span></div><div class="task-attachment-thumbs">'+items.slice(0,6).map(function(x,i){return x.data?'<img src="'+esc(x.data)+'" alt="Фото '+(i+1)+'">':'<span>Фото '+(i+1)+'</span>'}).join('')+'</div></div>';
 }
 function render(t){
  document.title=t.title+' — Сделает';
  var status=t.status||{},body='';
  var researchFirst=!!t.research&&!(t.payment&&t.payment.status==='paid');
  root.classList.toggle('rp-research-first',researchFirst);
  body+='<div class="account-workspace-head"><div class="account-workspace-meta"><span class="account-status" data-status="'+esc(status.code)+'">'+esc(status.label)+'</span><span>'+esc(t.region)+'</span><span>Обновлено '+esc(sdAccount.fmtDate(t.updatedAt||t.createdAt))+'</span></div><h1>'+esc(t.title)+'</h1><div class="account-task-result">'+esc(t.keyResult)+'</div>';
  if(status.code==='draft')body+='<div style="margin-top:16px"><a href="#" class="account-primary" data-resume-task="'+esc(t.taskId)+'">Продолжить заполнение</a></div>';
  body+='</div>';
  if(t.research||t.payment)body+=workspaceNav(t);
  if(t.payment&&t.payment.status==='paid')body+=workspaceKpis(t);
  if(t.payment&&t.payment.status==='paid')body+=outreachStateBanner(t);

  if(!researchFirst){body+=sectionDivider('01','Задача','Описание, размеры и вложения');body+=taskSection(t,t.payment&&t.payment.status==='paid');}
  body+=taskAttachmentsBlock(t);

  if(t.research||status.code==='researching'){body+=sectionDivider('02','Исследование','Что нашли на рынке');body+=researchSection(t);}
  if(researchFirst)body+='<details class="rp-task-details" id="task-details"><summary>Описание и детали задачи</summary>'+taskSection(t)+'</details>';
  if(t.payment&&t.payment.status==='paid'){body+=sectionDivider('03','Исполнители','Сравните и выберите подходящих');body+=selectionSection(t);}
  if((t.counts&&t.counts.outreach)||(t.replies&&t.replies.length)){body+=sectionDivider('04','Обращения и ответы','Статусы отправки и ответы исполнителей');body+=responsesSection(t);}
  if(t.offers&&t.offers.length){body+=sectionDivider('05','Сравнение','Цена, сроки и условия');body+=comparisonSection(t);}
  if(t.payment){body+=sectionDivider('06','Оплата','Тариф и статус платежа');body+=paymentSection(t);}

  if(t.pricing&&t.pricing.repeatDiscount&&t.pricing.repeatDiscount.eligible&&t.payment&&t.payment.status==='paid'){
    body+='<div class="account-subtle-offer"><b>Есть ещё задача?</b> Для следующего подбора у вас действует скидка 30%. <a href="create-task.html?new=1" data-new-task>Создать новую задачу</a><div style="margin-top:5px">Подбор — 690 ₽ вместо 990 ₽ · До выбора — 1 790 ₽ вместо 2 590 ₽</div></div>';
    trackWorkspaceOnce('repeat_discount_shown',{surface:'task'});
  }
  var html=(t.payment&&t.payment.status==='paid')?'<div class="task-workspace-layout">'+taskStatusRail(t)+'<div class="task-workspace-main">'+body+'</div></div>':body;
  sdMotion.reconcile(root,html);
  bindActions(t);
  if(t.research)trackWorkspaceOnce('research_result_open',{task_id:t.taskId});
  if(t.payment&&t.payment.status==='paid')trackWorkspaceOnce('selection_open',{task_id:t.taskId});
  if(t.offers&&t.offers.length)trackWorkspaceOnce('comparison_open',{task_id:t.taskId});
 }
 function workspaceNav(t){
  var links=[['task-description','Задача'],['research','Исследование']];
  if(t.payment&&t.payment.status==='paid')links.push(['selection','Исполнители']);
  if((t.counts&&t.counts.outreach)||(t.replies&&t.replies.length))links.push(['responses','Ответы']);
  if(t.offers&&t.offers.length)links.push(['comparison','Сравнение']);
  if(t.payment)links.push(['payment','Оплата']);
  return '<nav class="workspace-nav workspace-progress" aria-label="Разделы задачи">'+links.map(function(x,i){return '<a href="#'+x[0]+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+x[1]+'</a>'}).join('')+'</nav>';
 }
 function workspaceKpis(t){
  var candidates=Number(t.counts&&t.counts.candidates||t.research&&t.research.candidateCount||0),outreach=Number(t.counts&&t.counts.outreach||0),replies=Number(t.counts&&t.counts.replies||0),offers=Number(t.counts&&t.counts.offers||0);
  return '<div class="workspace-kpis"><div><span>Найдено</span><b>'+candidates+'</b><small>исполнителей</small></div><div><span>Запросы</span><b>'+outreach+'</b><small>отправлено</small></div><div><span>Ответы</span><b>'+replies+'</b><small>получено</small></div><div><span>Предложения</span><b>'+offers+'</b><small>для сравнения</small></div></div>';
 }
 function outreachStateBanner(t){
  var attempts=t.outreach||[],sent=attempts.filter(function(a){return ['sent','delivered'].includes(a.status)}),replied=attempts.filter(function(a){return a.status==='replied'}),failed=attempts.filter(function(a){return a.status==='failed'});
  if(!attempts.length)return '';
  if(replied.length){
   return '<div class="outreach-state-banner replied"><div class="outreach-state-icon">✓</div><div><b>Получены ответы: '+replied.length+'</b><span>Откройте блок «Обращения и ответы» — можно переходить к сравнению предложений.</span></div><a href="#responses">Посмотреть ответы →</a></div>';
  }
  if(sent.length){
   return '<div class="outreach-state-banner waiting"><div class="outreach-state-icon">✓</div><div><b>Запросы отправлены: '+sent.length+'</b><span>Ждём ответы исполнителей. Они появятся в этой задаче автоматически.'+(failed.length?' Не отправлено: '+failed.length+'.':'')+'</span></div><a href="#responses">Статус обращений →</a></div>';
  }
  if(failed.length){
   return '<div class="outreach-state-banner failed"><div class="outreach-state-icon">!</div><div><b>Запросы не отправлены</b><span>Есть подтверждённая ошибка отправки. Ниже можно увидеть причину и повторить действие после исправления.</span></div><a href="#responses">Посмотреть ошибку →</a></div>';
  }
  return '<div class="outreach-state-banner pending"><div class="outreach-state-icon">…</div><div><b>Уточняем статус отправки</b><span>Повторно ничего не отправляем, пока не подтверждён результат предыдущей попытки.</span></div><a href="#responses">Проверить статус →</a></div>';
 }
 function taskSection(t,collapsed){
  var j=t.taskJson||{},rows=[];
  [['Категория',j.category],['Регион',t.region],['Желаемый результат',j.goal],['Сроки',j.timing],['Объём',j.scope],['Размеры',j.wallSize]].forEach(function(x){if(x[1])rows.push('<div class="account-summary-item"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>')});
  var body='<div class="section-body"><p class="task-description-copy">'+esc(t.description||t.rawService||'Описание сохранено в задаче.')+'</p>'+(rows.length?'<div class="account-summary-grid">'+rows.join('')+'</div>':'')+'</div>';
  if(collapsed)return '<details class="account-section account-section-fold" id="task-description"><summary><span><b>Задача</b><small>Описание, цель, объём и размеры</small></span><span class="fold-action">Показать</span></summary>'+body+'</details>';
  return '<section class="account-section" id="task-description"><h2>Задача</h2>'+body+'</section>';
 }
 function researchSection(t){
  var r=t.research,s='<section class="account-section account-section-research" id="research"><div class="section-title-row"><div><span class="section-kicker">Исследование рынка</span><h2>Что уже нашли</h2></div></div>';
  if(!r)return s+sdMotion.statusHtml('working','Исследуем рынок','Ждём подтверждённый результат. Статус обновляется в этой задаче.')+'</section>';
  var model=sdResearchPricing.buildModel({count:r.candidateCount});
  s+='<div class="research-summary"><div class="research-number"><b>'+esc(model.count==null?'—':model.count)+'</b><span>На первом этапе найдено</span></div><div><p><b>Это текущий результат исследования, а не лимит рынка.</b></p><p>При необходимости поиск можно продолжить в рамках доступного тарифа.</p><small>Данные '+esc(sdAccount.fmtDate(r.createdAt))+'</small></div></div>';
  if(!(t.payment&&t.payment.status==='paid'))s+=pricingBlock(t);
  return s+'</section>';
 }
 function pricingBlock(t){
  return sdResearchPricing.renderAccount({count:t.research&&t.research.candidateCount,pricing:t.pricing||{}});
 }
 function normalizePrevisitFields(value){
  var out=(Array.isArray(value)?value:[]).map(function(v){
   var x=String(v||'').trim();
   if(/^Итоговая стоимость$/i.test(x))return'предварительную стоимость до выезда — точную сумму, если возможно, иначе диапазон от–до';
   if(/^Стоимость работ$/i.test(x))return'предварительную стоимость работ до выезда — сумму или диапазон';
   if(/^Стоимость устранения$/i.test(x))return'предварительную стоимость устранения по описанию / фото — ориентир или диапазон';
   if(/^Замер$/i.test(x))return'нужен ли выезд / замер для окончательной сметы и сколько он стоит';
   return x;
  }).filter(Boolean);
  if(!out.some(function(v){return/предварительн.{0,20}стоим|диапазон от.?до/i.test(v)}))out.unshift('предварительную оценку стоимости до выезда по описанию и фото; если точную цену назвать нельзя — диапазон или типовой ориентир');
  if(!out.some(function(v){return/измен.{0,20}цен|повли.{0,20}цен|после осмотр|после замер/i.test(v)}))out.push('что может изменить цену после осмотра / замера');
  if(!out.some(function(v){return/стоим.{0,18}(выезд|замер)|(выезд|замер).{0,18}стоим/i.test(v)}))out.push('стоимость выезда / замера, если он платный');
  if(!out.some(function(v){return/засчит|вычита.{0,18}(выезд|замер)|(выезд|замер).{0,25}(работ|заказ)/i.test(v)}))out.push('засчитывается ли стоимость выезда / замера в стоимость работ при заказе');
  if(!out.some(function(v){return/минимальн.{0,18}(заказ|чек|стоим)/i.test(v)}))out.push('минимальную стоимость заказа / минимальный чек, если есть');
  if(!out.some(function(v){return/входит.{0,25}предварительн|что.{0,18}уточня.{0,18}(выезд|замер)/i.test(v)}))out.push('что входит в предварительный расчёт сейчас и что будет уточняться только после выезда / замера');
  if(!out.some(function(v){return/каких.{0,20}(данн|размер|фото)|что.{0,20}не хватает.{0,20}(расч|оцен)|дистанцион/i.test(v)}))out.push('если даже диапазон сейчас назвать нельзя — каких конкретно данных, размеров или фото не хватает для дистанционного предварительного расчёта');
  return out;
 }
 function buildOutreachMessage(t,c){
  var j=t.taskJson||{},fields=normalizePrevisitFields(list(j.requestFields)),lines=['Добрый день!','',String(t.title||j.category||'Задача'),'','Нужен предварительный расчёт до выезда по описанию и приложенным фото. На этом этапе выезд мастера не требуется.','Если точную стоимость без осмотра назвать нельзя — укажите, пожалуйста, диапазон или типовой ориентир и от чего будет зависеть уточнение цены.','Ответ только «стоимость после замера» без предварительного ориентира не поможет сравнить предложения — нужен хотя бы диапазон по имеющимся данным.','','Задача:','— '+String(t.description||j.description||j.scope||'Нужен расчёт по задаче')];
  if(t.region)lines.push('— Регион: '+t.region);
  if(j.goal)lines.push('— Желаемый результат: '+j.goal);
  if(j.timing)lines.push('— Сроки: '+j.timing);
  if(j.wallSize)lines.push('— Размеры: '+j.wallSize);
  lines.push('','В первом ответе, до выезда, укажите:');
  (fields.length?fields:normalizePrevisitFields(['Итоговая стоимость','что входит в работы и материалы','возможные доплаты','срок выполнения','гарантию'])).forEach(function(x){lines.push('— '+x)});
  lines.push('','Если предварительный диапазон по имеющимся данным посчитать невозможно — укажите, пожалуйста, каких конкретно данных, размеров или фото не хватает. Мы уточним их до выезда.','После этого, если для окончательной сметы нужен осмотр или замер, мы согласуем его отдельно.','Ответьте, пожалуйста, обычным ответом на это письмо — сервис «Сделает» добавит предложение в сравнение.');
  return lines.join('\n');
 }
 function candidateTypeLabel(c){return c.type==='private'?'Частный мастер':c.type==='unverified'?'Тип не подтверждён':'Компания'}
 function candidateFacts(c){
  var facts=list(c.facts).slice(0,4);
  if(!facts.length)return '<div class="decision-empty">Дополнительные публичные факты пока не найдены.</div>';
  return facts.map(function(f){var st=String(f.status||'unknown'),label=st==='ok'||st==='confirmed'?'Подтверждено':st==='claim'||st==='claimed'?'Заявлено исполнителем':st==='risk'?'Требует внимания':'Не удалось проверить',cls=st==='ok'||st==='confirmed'?'ok':st==='claim'||st==='claimed'?'claim':st==='risk'?'risk':'unknown';return '<div class="decision-fact '+cls+'"><span class="decision-dot">'+(cls==='ok'?'✓':cls==='risk'?'!':cls==='claim'?'◐':'?')+'</span><div><b>'+esc(label)+'</b><p>'+esc(f.label||f.text||f.value||'Факт из источника')+'</p></div></div>'}).join('');
 }
 function candidateSignals(c){
  var out=[],e=c.evidence||{},domain=e.history&&e.history.domain,fns=e.fnsProfile||c.fnsProfile,rep=c.selectionBreakdown&&c.selectionBreakdown.reputationDetails;
  if(rep&&(rep.rating||rep.reviewsCount))out.push(['Репутация',(rep.rating?String(rep.rating):'—')+(rep.reviewsCount?' · '+rep.reviewsCount+' отзывов':'')]);
  if(domain&&domain.domain)out.push(['Домен',domain.createdAt?'с '+String(domain.createdAt).slice(0,4):domain.domain]);
  if(fns&&fns.available!==false)out.push(['Юрлицо',fns.registeredAt?'с '+String(fns.registeredAt).slice(0,4):(fns.active===false?'не действует':'проверено')]);
  if(list(c.sources).length)out.push(['Источники',String(list(c.sources).length)]);
  return out.slice(0,4).map(function(x){return '<div class="decision-signal"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'}).join('');
 }
 function telegramHref(v){
  v=String(v||'').trim();
  if(!v)return '';
  if(v.charAt(0)==='@')return 'https://t.me/'+v.slice(1);

    recipients.push({id:c.id,name:c.name||'Исполнитель',email:String(c.email||'').trim(),telegram:String(c.telegram||'').trim(),channels:channels,telegramManual:channels.includes('telegram')});
   });
   if(!recipients.length){next.disabled=false;next.textContent='Выберите хотя бы один канал';return;}
   var pref=sharing(),message=composedMessage();
   try{localStorage.setItem('sdelaet.contact-sharing.'+t.taskId,JSON.stringify(pref));}catch(e){}
   var payload={version:6,taskId:t.taskId,orderId:t.payment&&t.payment.orderId||'',subject:'Запрос по задаче в сервисе «Сделает»',recipients:recipients,candidateIds:recipients.map(function(x){return x.id}),message:message,attachmentCount:attachments.length,contactSharing:pref,preparedAt:new Date().toISOString(),returnPath:'/task.html?task='+encodeURIComponent(t.taskId)+'#selection'};
   try{localStorage.setItem('sdelaet.outreach.review.v1',JSON.stringify(payload));}catch(e){return;}
   sdAccount.track('outreach_review_ready',{task_id:t.taskId,recipient_count:recipients.length,attachment_count:attachments.length,contact_sharing:pref.mode});
   location.href='/review.html?outreach=1';
  };
 }
 function applySelectionFilter(filter){
  var cards=Array.from(root.querySelectorAll('.decision-candidate')),shown=0;
  cards.forEach(function(card){var yes=filter==='all'||filter==='company'&&card.dataset.candidateType!=='private'||filter==='private'&&card.dataset.candidateType==='private'||filter==='contact'&&card.dataset.candidateContact==='yes';card.hidden=!yes;if(yes)shown++;});
  root.querySelectorAll('[data-selection-filter]').forEach(function(b){b.classList.toggle('active',b.dataset.selectionFilter===filter)});
  var count=root.querySelector('#selectionVisibleCount');if(count)count.textContent='Показано '+shown;
 }
 function bindSelectionActions(t){
  root.querySelectorAll('[data-candidate-select]').forEach(function(input){input.onchange=function(){var cid=input.dataset.candidateSelect;if(input.checked)selectedCandidateIds.add(cid);else selectedCandidateIds.delete(cid);updateSelectionBar();sdAccount.track('candidate_selection_changed',{task_id:t.taskId,candidate_id:cid,selected:input.checked})}});
  root.querySelectorAll('[data-selection-filter]').forEach(function(button){button.onclick=function(){applySelectionFilter(button.dataset.selectionFilter);sdAccount.track('candidate_filter_changed',{task_id:t.taskId,filter:button.dataset.selectionFilter})}});
  root.querySelectorAll('[data-manual-telegram-sent]').forEach(function(button){button.onclick=async function(){var requestId=button.dataset.manualTelegramSent,authorizationId=button.dataset.authorizationId;if(!requestId||!authorizationId)return;button.disabled=true;var old=button.textContent;button.textContent='Фиксируем…';try{await sdAccount.api('/v1/outreach/manual-sent',{method:'POST',body:JSON.stringify({requestId:requestId,authorizationId:authorizationId})});sdAccount.track('request_mark_sent',{task_id:t.taskId,channel:'telegram'});if(workspaceController)await workspaceController.refresh();}catch(e){button.disabled=false;button.textContent=old;alert('Не удалось сохранить статус Telegram: '+(e.message||'ошибка'));}}});
  var review=root.querySelector('[data-review-selected]');if(review)review.onclick=function(){openSelectionReview(t)};
  updateSelectionBar();
 }
 function bindClarificationActions(t){
  root.querySelectorAll('[data-send-clarification]').forEach(function(button){
   button.onclick=async function(){
    var clarificationId=button.dataset.sendClarification;if(!clarificationId)return;
    var original=button.textContent;button.disabled=true;button.textContent='Отправляем…';
    try{
     await sdAccount.api('/v1/account/tasks/'+encodeURIComponent(t.taskId)+'/clarifications/'+encodeURIComponent(clarificationId)+'/send',{method:'POST',body:JSON.stringify({explicitConfirm:true})});
     sdAccount.track('contractor_clarification_sent',{task_id:t.taskId,clarification_id:clarificationId,reason:'previsit_price'});
     if(workspaceController)await workspaceController.refresh();
    }catch(e){
     button.disabled=false;button.textContent=original;
     alert('Не удалось отправить уточнение: '+(e.message||'ошибка'));
    }
   };
  });
 }
 function bindWorkspaceProgress(){
  var nav=root.querySelector('.workspace-progress');if(!nav)return;
  if(root.__workspaceProgressObserver){try{root.__workspaceProgressObserver.disconnect()}catch(e){}}
  var links=Array.from(nav.querySelectorAll('a[href^="#"]')),targets=links.map(function(link){return{link:link,id:link.getAttribute('href').slice(1),el:document.getElementById(link.getAttribute('href').slice(1))}}).filter(function(x){return x.el});
  function activate(id){links.forEach(function(link){var yes=link.getAttribute('href')==='#'+id;link.classList.toggle('active',yes);if(yes)link.setAttribute('aria-current','step');else link.removeAttribute('aria-current')})}
  links.forEach(function(link){link.onclick=function(){activate(link.getAttribute('href').slice(1))}});
  var observer=new IntersectionObserver(function(entries){
   var visible=entries.filter(function(e){return e.isIntersecting}).sort(function(a,b){return Math.abs(a.boundingClientRect.top)-Math.abs(b.boundingClientRect.top)});
   if(visible.length)activate(visible[0].target.id);
  },{root:null,rootMargin:'-145px 0px -65% 0px',threshold:[0,0.01]});
  targets.forEach(function(x){observer.observe(x.el)});
  root.__workspaceProgressObserver=observer;
  var hash=location.hash&&location.hash.slice(1);if(hash&&targets.some(function(x){return x.id===hash}))activate(hash);else if(targets.length)activate(targets[0].id);
 }
 function bindActions(t){
  workspaceController=sdJourney.mountWorkspace(root,t,render);
  bindWorkspaceProgress();
  bindClarificationActions(t);
  if(t.payment&&t.payment.status==='paid')bindSelectionActions(t);
 }
});
</script>
