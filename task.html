<body class="account-body">
<div class="account-shell">
<aside class="account-sidebar">
 <a class="account-brand" href="/"><img src="assets/logo-icon.svg" alt=""><strong>Сдела<span>ет</span></strong></a>

 <div class="account-sidebar-bottom"><a href="/">На главную</a><button type="button" data-account-logout>Выйти</button></div>

 <header class="account-topbar"><a class="account-topbar-brand" href="/"><img src="assets/logo-icon.svg" alt=""><strong>Сдела<span>ет</span></strong></a><div class="account-topbar-actions"><span class="account-user" data-account-email></span><a class="account-secondary" href="my-tasks.html">Все задачи</a></div></header>
 <div class="account-content" id="taskRoot"><div class="account-loading">Загружаем задачу…</div></div>
</main>

<script>
document.addEventListener('DOMContentLoaded',async function(){
 var root=document.getElementById('taskRoot'),id=new URLSearchParams(location.search).get('task'),viewEvents=new Set(),selectedCandidateIds=new Set(),workspaceController=null;
 function trackWorkspaceOnce(name,params){var key=name+':'+id;if(!viewEvents.has(key)){viewEvents.add(key);sdAccount.track(name,params);}}
 if(!id){location.replace('/my-tasks.html');return}
 try{
  await sdAccount.requireAuth();
  var d=await sdAccount.api('/v1/account/tasks/'+encodeURIComponent(id)),t=d.task;
  render(t);
  if(t.research&&!(t.payment&&t.payment.status==='paid'))sdJourney.resumeCheckout({taskId:t.taskId,task:t,research:t.research,pricing:t.pricing,title:t.title,region:t.region}).catch(function(){});
 }catch(e){
  if(e.message==='AUTH_REQUIRED')return;
  if(e.message==='TASK_NOT_FOUND'){root.innerHTML='<div class="account-error">Задача не найдена или недоступна этому аккаунту. <a href="my-tasks.html">Вернуться в «Мои задачи»</a></div>';return}
  root.innerHTML='<div class="account-error">Не удалось загрузить задачу. Попробуйте обновить страницу.</div>';
 }
 function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function list(v){return Array.isArray(v)?v.filter(Boolean):[]}
 function render(t){
  document.title=t.title+' — Сделает';
  var status=t.status||{},html='';
  var researchFirst=!!t.research&&!(t.payment&&t.payment.status==='paid');
  root.classList.toggle('rp-research-first',researchFirst);
  html+='<div class="account-workspace-head"><div class="account-workspace-meta"><span class="account-status" data-status="'+esc(status.code)+'">'+esc(status.label)+'</span><span>'+esc(t.region)+'</span><span>Обновлено '+esc(sdAccount.fmtDate(t.updatedAt||t.createdAt))+'</span></div><h1>'+esc(t.title)+'</h1><div class="account-task-result">'+esc(t.keyResult)+'</div>';
  if(status.code==='draft')html+='<div style="margin-top:16px"><a href="#" class="account-primary" data-resume-task="'+esc(t.taskId)+'">Продолжить заполнение</a></div>';
  html+='</div>';
  if(t.research||t.payment)html+=workspaceNav(t);
  if(t.payment&&t.payment.status==='paid')html+=workspaceKpis(t);
  if(t.payment&&t.payment.status==='paid')html+=outreachStateBanner(t);

  if(!researchFirst)html+=taskSection(t,t.payment&&t.payment.status==='paid');

  if(t.research||status.code==='researching')html+=researchSection(t);
  if(researchFirst)html+='<details class="rp-task-details" id="task-details"><summary>Описание и детали задачи</summary>'+taskSection(t)+'</details>';
  if(t.payment&&t.payment.status==='paid')html+=selectionSection(t);
  if((t.counts&&t.counts.outreach)||(t.replies&&t.replies.length))html+=responsesSection(t);
  if(t.offers&&t.offers.length)html+=comparisonSection(t);
  if(t.payment)html+=paymentSection(t);

  if(t.pricing&&t.pricing.repeatDiscount&&t.pricing.repeatDiscount.eligible&&t.payment&&t.payment.status==='paid'){
    html+='<div class="account-subtle-offer"><b>Есть ещё задача?</b> Для следующего подбора у вас действует скидка 30%. <a href="create-task.html?new=1" data-new-task>Создать новую задачу</a><div style="margin-top:5px">Подбор — 690 ₽ вместо 990 ₽ · До выбора — 1 790 ₽ вместо 2 590 ₽</div></div>';
    trackWorkspaceOnce('repeat_discount_shown',{surface:'task'});
  }
  sdMotion.reconcile(root,html);
  bindActions(t);
  if(t.research)trackWorkspaceOnce('research_result_open',{task_id:t.taskId});
  if(t.payment&&t.payment.status==='paid')trackWorkspaceOnce('selection_open',{task_id:t.taskId});
  if(t.offers&&t.offers.length)trackWorkspaceOnce('comparison_open',{task_id:t.taskId});
 }
 function workspaceNav(t){
  var links=[['task-description','Задача'],['research','Исследование']];
  if(t.payment&&t.payment.status==='paid')links.push(['selection','Исполнители']);
  if((t.counts&&t.counts.outreach)||(t.replies&&t.replies.length))links.push(['responses','Ответы']);
  if(t.offers&&t.offers.length)links.push(['comparison','Сравнение']);
  if(t.payment)links.push(['payment','Оплата']);
  return '<nav class="workspace-nav" aria-label="Разделы задачи">'+links.map(function(x){return '<a href="#'+x[0]+'">'+x[1]+'</a>'}).join('')+'</nav>';
 }
 function workspaceKpis(t){
  var candidates=Number(t.counts&&t.counts.candidates||t.research&&t.research.candidateCount||0),outreach=Number(t.counts&&t.counts.outreach||0),replies=Number(t.counts&&t.counts.replies||0),offers=Number(t.counts&&t.counts.offers||0);
  return '<div class="workspace-kpis"><div><span>Найдено</span><b>'+candidates+'</b><small>исполнителей</small></div><div><span>Запросы</span><b>'+outreach+'</b><small>отправлено</small></div><div><span>Ответы</span><b>'+replies+'</b><small>получено</small></div><div><span>Предложения</span><b>'+offers+'</b><small>для сравнения</small></div></div>';
 }
 function outreachStateBanner(t){
  var attempts=t.outreach||[],sent=attempts.filter(function(a){return ['sent','delivered'].includes(a.status)}),replied=attempts.filter(function(a){return a.status==='replied'}),failed=attempts.filter(function(a){return a.status==='failed'});
  if(!attempts.length)return '';
  if(replied.length){
   return '<div class="outreach-state-banner replied"><div class="outreach-state-icon">✓</div><div><b>Получены ответы: '+replied.length+'</b><span>Откройте блок «Обращения и ответы» — можно переходить к сравнению предложений.</span></div><a href="#responses">Посмотреть ответы →</a></div>';
  }
  if(sent.length){
   return '<div class="outreach-state-banner waiting"><div class="outreach-state-icon">✓</div><div><b>Запросы отправлены: '+sent.length+'</b><span>Ждём ответы исполнителей. Они появятся в этой задаче автоматически.'+(failed.length?' Не отправлено: '+failed.length+'.':'')+'</span></div><a href="#responses">Статус обращений →</a></div>';
  }
  if(failed.length){
   return '<div class="outreach-state-banner failed"><div class="outreach-state-icon">!</div><div><b>Запросы не отправлены</b><span>Есть подтверждённая ошибка отправки. Ниже можно увидеть причину и повторить действие после исправления.</span></div><a href="#responses">Посмотреть ошибку →</a></div>';
  }
  return '<div class="outreach-state-banner pending"><div class="outreach-state-icon">…</div><div><b>Уточняем статус отправки</b><span>Повторно ничего не отправляем, пока не подтверждён результат предыдущей попытки.</span></div><a href="#responses">Проверить статус →</a></div>';
 }
 function taskSection(t,collapsed){
  var j=t.taskJson||{},rows=[];
  [['Категория',j.category],['Регион',t.region],['Желаемый результат',j.goal],['Сроки',j.timing],['Объём',j.scope],['Размеры',j.wallSize]].forEach(function(x){if(x[1])rows.push('<div class="account-summary-item"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>')});
  var body='<div class="section-body"><p class="task-description-copy">'+esc(t.description||t.rawService||'Описание сохранено в задаче.')+'</p>'+(rows.length?'<div class="account-summary-grid">'+rows.join('')+'</div>':'')+'</div>';
  if(collapsed)return '<details class="account-section account-section-fold" id="task-description"><summary><span><b>Задача</b><small>Описание, цель, объём и размеры</small></span><span class="fold-action">Показать</span></summary>'+body+'</details>';
  return '<section class="account-section" id="task-description"><h2>Задача</h2>'+body+'</section>';
 }
 function researchSection(t){
  var r=t.research,s='<section class="account-section account-section-research" id="research"><div class="section-title-row"><div><span class="section-kicker">Исследование рынка</span><h2>Что уже нашли</h2></div></div>';
  if(!r)return s+sdMotion.statusHtml('working','Исследуем рынок','Ждём подтверждённый результат. Статус обновляется в этой задаче.')+'</section>';
  var model=sdResearchPricing.buildModel({count:r.candidateCount});
  s+='<div class="research-summary"><div class="research-number"><b>'+esc(model.count==null?'—':model.count)+'</b><span>На первом этапе найдено</span></div><div><p><b>Это текущий результат исследования, а не лимит рынка.</b></p><p>При необходимости поиск можно продолжить в рамках доступного тарифа.</p><small>Данные '+esc(sdAccount.fmtDate(r.createdAt))+'</small></div></div>';
  if(!(t.payment&&t.payment.status==='paid'))s+=pricingBlock(t);
  return s+'</section>';
 }
 function pricingBlock(t){
  return sdResearchPricing.renderAccount({count:t.research&&t.research.candidateCount,pricing:t.pricing||{}});
 }
 function buildOutreachMessage(t,c){
  var j=t.taskJson||{},fields=list(j.requestFields),lines=['Добрый день!','',String(t.title||j.category||'Задача'),'','Задача:','— '+String(t.description||j.description||j.scope||'Нужен расчёт по задаче')];
  if(t.region)lines.push('— Регион: '+t.region);
  if(j.goal)lines.push('— Желаемый результат: '+j.goal);
  if(j.timing)lines.push('— Сроки: '+j.timing);
  if(j.wallSize)lines.push('— Размеры: '+j.wallSize);
  lines.push('','В ответе укажите:');
  (fields.length?fields:['итоговую стоимость','что входит в работы и материалы','возможные доплаты','срок выполнения','гарантию']).forEach(function(x){lines.push('— '+x)});
  lines.push('','Ответьте, пожалуйста, обычным ответом на это письмо — сервис «Сделает» добавит предложение в сравнение.');
  return lines.join('\n');
 }
 function candidateTypeLabel(c){return c.type==='private'?'Частный мастер':c.type==='unverified'?'Тип не подтверждён':'Компания'}
 function candidateFacts(c){
  var facts=list(c.facts).slice(0,4);
  if(!facts.length)return '<div class="decision-empty">Дополнительные публичные факты пока не найдены.</div>';
  return facts.map(function(f){var st=String(f.status||'unknown'),label=st==='ok'||st==='confirmed'?'Подтверждено':st==='claim'||st==='claimed'?'Заявлено исполнителем':st==='risk'?'Требует внимания':'Не удалось проверить',cls=st==='ok'||st==='confirmed'?'ok':st==='claim'||st==='claimed'?'claim':st==='risk'?'risk':'unknown';return '<div class="decision-fact '+cls+'"><span class="decision-dot">'+(cls==='ok'?'✓':cls==='risk'?'!':cls==='claim'?'◐':'?')+'</span><div><b>'+esc(label)+'</b><p>'+esc(f.label||f.text||f.value||'Факт из источника')+'</p></div></div>'}).join('');
 }
 function candidateSignals(c){
  var out=[],e=c.evidence||{},domain=e.history&&e.history.domain,fns=e.fnsProfile||c.fnsProfile,rep=c.selectionBreakdown&&c.selectionBreakdown.reputationDetails;
  if(rep&&(rep.rating||rep.reviewsCount))out.push(['Репутация',(rep.rating?String(rep.rating):'—')+(rep.reviewsCount?' · '+rep.reviewsCount+' отзывов':'')]);
  if(domain&&domain.domain)out.push(['Домен',domain.createdAt?'с '+String(domain.createdAt).slice(0,4):domain.domain]);
  if(fns&&fns.available!==false)out.push(['Юрлицо',fns.registeredAt?'с '+String(fns.registeredAt).slice(0,4):(fns.active===false?'не действует':'проверено')]);
  if(list(c.sources).length)out.push(['Источники',String(list(c.sources).length)]);
  return out.slice(0,4).map(function(x){return '<div class="decision-signal"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'}).join('');
 }
 function candidateCard(t,c,index,attempts){
  var a=attempts.find(function(x){return x.candidateId===c.id}),why=list(c.why).slice(0,2),canSend=!!c.email&&!a,selected=selectedCandidateIds.has(c.id),site=sdJourney.safeExternalUrl(c.website),contacts='',e=c.evidence||{},fns=e.fnsProfile||c.fnsProfile||null,fnsConfirmed=!!(window.sdCandidateEvidence&&sdCandidateEvidence.fnsMatches&&sdCandidateEvidence.fnsMatches(c,e)),fnsState=fns&&fns.available!==false?(fnsConfirmed?'confirmed':'partial'):'unknown';
  if(c.phone)contacts+='<div class="decision-contact"><span>Телефон</span><b>'+esc(c.phone)+'</b></div>';
  if(c.email)contacts+='<div class="decision-contact"><span>Email</span><b>'+esc(c.email)+'</b></div>';
  if(site)contacts+='<a class="decision-contact link" href="'+esc(site)+'" target="_blank" rel="noopener"><span>Сайт / профиль</span><b>Открыть ↗</b></a>';
  var select='';
  if(a){
   var st=String(a.status||''),cls=st==='failed'?'error':st==='replied'?'replied':['sent','delivered'].includes(st)?'success':'pending',title=st==='replied'?'Ответ получен':st==='delivered'?'Доставлено · ждём ответ':st==='sent'?'Запрос отправлен · ждём ответ':st==='failed'?'Запрос не отправлен':('Статус: '+sdJourney.outreachLabel(st)),note=st==='failed'?(a.lastError?('Ошибка: '+a.lastError):'Сервер подтвердил ошибку отправки.'):(a.sentAt?('Отправлено '+sdAccount.fmtDate(a.sentAt)):'Статус сохранён в задаче');
   select='<div class="decision-outreach-status '+cls+'"><b>'+esc(title)+'</b><span>'+esc(note)+'</span></div>';
  }else if(canSend)select='<label class="decision-select"><input type="checkbox" data-candidate-select="'+esc(c.id)+'" '+(selected?'checked':'')+'><span><b>Выбрать для запроса</b><small>Добавим в общий запрос выбранным исполнителям</small></span></label>';
  else select='<div class="decision-outreach-status muted"><b>Автоотправка недоступна</b><span>Публичный email не найден — можно связаться вручную.</span></div>';
  var fnsBadge=fnsState==='confirmed'?'<span class="candidate-state good">ФНС подтверждена</span>':fnsState==='partial'?'<span class="candidate-state warn">ФНС: связь не подтверждена</span>':'<span class="candidate-state neutral">ФНС: нет подтверждения</span>';
  return '<article class="decision-candidate '+(selected?'is-selected':'')+'" data-candidate-id="'+esc(c.id)+'" data-candidate-type="'+esc(c.type||'company')+'" data-candidate-contact="'+(c.email?'yes':'no')+'" data-candidate-fns="'+fnsState+'"><div class="decision-head"><div class="decision-avatar">'+esc(String(c.name||'?').split(/\s+/).slice(0,2).map(function(x){return x.charAt(0)}).join('').toUpperCase())+'</div><div class="decision-title"><div class="decision-rank">#'+(index+1)+' · '+esc(candidateTypeLabel(c))+'</div><h3>'+esc(c.name||'Исполнитель')+'</h3><p>'+esc(c.geo||t.region||'')+'</p></div><div class="decision-match"><span>Соответствие задаче</span><b>'+esc(c.matchLevel||'Подтверждено')+'</b></div></div><div class="candidate-state-row"><span class="candidate-state good">Профиль подходит</span>'+(c.email?'<span class="candidate-state good">Email найден</span>':'<span class="candidate-state neutral">Email не найден</span>')+fnsBadge+'</div>'+(candidateSignals(c)?'<div class="decision-signals decision-signals-primary">'+candidateSignals(c)+'</div>':'')+(contacts?'<div class="decision-contacts">'+contacts+'</div>':'')+'<div class="decision-why-compact"><b>Почему подходит</b><ul>'+(why.length?why.map(function(x){return '<li>'+esc(x)+'</li>'}).join(''):'<li>Соответствие подтверждено найденными данными.</li>')+'</ul></div><details class="decision-more"><summary><span>Подробнее: проверки, юрданные и источники</span><span>Развернуть</span></summary><div class="decision-more-body"><div class="decision-grid"><section><h4>Что удалось проверить</h4><div class="decision-facts">'+candidateFacts(c)+'</div></section><section class="decision-evidence-wrap"><h4>Источники и юридические данные</h4>'+sdCandidateEvidence.render(c)+'</section></div></div></details>'+select+'<button type="button" class="account-hidden" data-send-proxy="'+esc(c.id)+'"></button></article>';
 }
 function selectionSection(t){
  var attempts=t.outreach||[],candidates=t.candidates||[],cards=candidates.map(function(c,i){return candidateCard(t,c,i,attempts)}).join('');
  var companyCount=candidates.filter(function(c){return c.type!=='private'}).length,privateCount=candidates.filter(function(c){return c.type==='private'}).length,contactCount=candidates.filter(function(c){return !!c.email}).length;
  return '<section class="account-section decision-selection" id="selection"><div class="decision-section-head"><div><div class="eyebrow">Подбор по задаче</div><h2>Сравните исполнителей и выберите подходящих</h2><p>Сначала главное. Подробные проверки, ФНС и источники раскрываются внутри карточки — страница не должна превращаться в сплошной отчёт.</p></div><div class="decision-count">'+candidates.length+' кандидатов</div></div><div class="decision-journey"><div class="active"><b>1 · Выберите</b><span>Сравните карточки</span></div><div><b>2 · Проверьте запрос</b><span>Получатели и текст</span></div><div><b>3 · Подтвердите</b><span>Ничего без согласия</span></div><div><b>4 · Сравним ответы</b><span>Цена, сроки, состав</span></div></div><div class="selection-toolbar"><div class="selection-filters" role="group" aria-label="Фильтр исполнителей"><button type="button" class="active" data-selection-filter="all">Все · '+candidates.length+'</button>'+(companyCount?'<button type="button" data-selection-filter="company">Компании · '+companyCount+'</button>':'')+(privateCount?'<button type="button" data-selection-filter="private">Мастера · '+privateCount+'</button>':'')+'<button type="button" data-selection-filter="contact">С email · '+contactCount+'</button></div><span id="selectionVisibleCount">Показано '+candidates.length+'</span></div><div class="account-candidate-list decision-list">'+(cards||'<div class="account-mini-card"><p>Подбор формируется.</p></div>')+'</div><div class="decision-selection-bar" id="decisionSelectionBar" hidden><div><b><span id="decisionSelectedCount">0</span> выбрано</b><span>Проверим получателей и одинаковый запрос перед отправкой.</span></div><button class="account-primary" type="button" data-review-selected>Продолжить с выбранными →</button></div></section>';
 }
 function responsesSection(t){
  var replies=(t.replies||[]).map(function(r){var d=t.dialogues&&t.dialogues[r.request_id],state=d&&d.current_state,pending=state&&state.pending_clarifications||[];return '<div class="account-mini-card"><b>Ответ исполнителя</b><p>'+esc(r.raw_text||'Получен ответ')+'</p><p>'+esc(sdAccount.fmtDate(r.received_at))+'</p>'+(state?'<p><b>Состояние:</b> '+esc(state.comparable?'готово к сравнению':state.blocking_reason||state.status)+'</p>':'')+(pending.length?'<p><b>Нужно уточнить:</b> '+esc((pending[0].items||[]).join('; '))+'</p>':'')+'</div>'}).join('');
  var attempts=(t.outreach||[]).map(function(a){var st=String(a.status||''),label=st==='replied'?'Ответ получен':st==='delivered'?'Доставлено — ждём ответ':st==='sent'?'Отправлено — ждём ответ':st==='failed'?'Не отправлено':sdJourney.outreachLabel(st);return '<div class="account-mini-card outreach-attempt-card" data-outreach-status="'+esc(st)+'"><div class="outreach-attempt-head"><b>'+esc(a.candidateName||'Исполнитель')+'</b><span>'+esc(label)+'</span></div>'+(a.recipient?'<p>'+esc(a.recipient)+'</p>':'')+(a.sentAt?'<p>Отправлено '+esc(sdAccount.fmtDate(a.sentAt))+'</p>':'')+(a.lastError?'<p class="response-error">Ошибка: '+esc(a.lastError)+'</p>':'')+'</div>'}).join('');
  return '<details class="account-section account-section-fold account-section-responses" id="responses" open><summary><span><b>Обращения и ответы</b><small>Отправлено '+Number(t.counts&&t.counts.outreach||0)+' · ответов '+Number(t.counts&&t.counts.replies||0)+'</small></span><span class="fold-action">Показать</span></summary><div class="section-body"><div class="account-response-list">'+attempts+replies+'</div></div></details>';
 }
 function comparisonSection(t){
  var cards=(t.offers||[]).map(function(o){var n=o.normalized||{},price=n.totalPrice||n.price||n.total_price||'',time=n.leadTime||n.term||n.duration||'';return '<div class="account-mini-card"><b>Предложение исполнителя</b>'+(price?'<p>Цена: '+esc(price)+'</p>':'')+(time?'<p>Срок: '+esc(time)+'</p>':'')+'<p>Статус сравнения: '+esc(o.comparisonStatus||'готово')+'</p></div>'}).join('');
  return '<section class="account-section" id="comparison"><h2>Сравнение предложений</h2><p>Сравниваем цену, состав работ, условия и неясные моменты.</p><div class="account-offer-list">'+cards+'</div></section>';
 }
 function paymentSection(t){
  var p=t.payment,type=p.priceType==='repeat'?'Повторное обращение':'Обычная цена';
  return '<details class="account-section account-section-fold account-section-payment" id="payment"><summary><span><b>Оплата</b><small>'+esc(p.planName)+' · '+esc(sdAccount.money(p.amount))+' · '+esc(sdJourney.paymentLabel(p.status))+'</small></span><span class="fold-action">Показать</span></summary><div class="section-body"><div class="account-payment-grid"><div class="account-payment-cell"><span>Тариф</span><b>'+esc(p.planName)+'</b></div><div class="account-payment-cell"><span>Цена</span><b>'+esc(sdAccount.money(p.amount))+(p.priceType==='repeat'?' вместо '+esc(sdAccount.money(p.regularAmount)):'')+'</b></div><div class="account-payment-cell"><span>Тип цены</span><b>'+esc(type)+'</b></div><div class="account-payment-cell"><span>Статус</span><b>'+esc(sdJourney.paymentLabel(p.status))+'</b></div></div><p>'+esc(sdAccount.fmtDate(p.paidAt||p.createdAt))+'</p></div></details>';
 }
 function updateSelectionBar(){
  var bar=document.getElementById('decisionSelectionBar'),count=document.getElementById('decisionSelectedCount');if(!bar||!count)return;
  count.textContent=String(selectedCandidateIds.size);bar.hidden=selectedCandidateIds.size===0;
  root.querySelectorAll('.decision-candidate').forEach(function(card){card.classList.toggle('is-selected',selectedCandidateIds.has(card.dataset.candidateId))});
 }
 function closeSelectionReview(){var m=document.getElementById('selectionReviewModal');if(m)m.remove()}
 async function openSelectionReview(t){
  var candidates=(t.candidates||[]).filter(function(c){return selectedCandidateIds.has(c.id)});if(!candidates.length)return;
  var attempts=t.outreach||[],available=candidates.filter(function(c){return !attempts.some(function(a){return a.candidateId===c.id&&['sent','delivered','replied','prepared','sending','queued'].includes(a.status)})});
  if(!available.length)return;
  var modal=document.createElement('div');modal.id='selectionReviewModal';modal.className='selection-review-modal';
  var message=buildOutreachMessage(t);
  function channelRow(c){
   var hasEmail=!!String(c.email||'').trim(),hasTelegram=!!String(c.telegram||'').trim(),emailChecked=hasEmail?'checked':'';
   return '<div class="outreach-prep-recipient" data-prep-candidate="'+esc(c.id)+'"><div class="outreach-prep-recipient-head"><div><b>'+esc(c.name||'Исполнитель')+'</b><span>'+esc(c.type==='private'?'Частный мастер':'Исполнитель')+'</span></div></div><div class="outreach-prep-channels">'+
    '<label class="outreach-channel email '+(hasEmail?'':'disabled')+'"><input type="checkbox" data-prep-channel="email" '+emailChecked+' '+(hasEmail?'':'disabled')+'><span><b>Email <em>автоматически</em></b><small>'+(hasEmail?esc(c.email):'Адрес не найден')+'</small></span></label>'+
    '<label class="outreach-channel telegram '+(hasTelegram?'':'disabled')+'"><input type="checkbox" data-prep-channel="telegram" '+(hasTelegram?'':'disabled')+'><span><b>Telegram <em>вручную</em></b><small>'+(hasTelegram?esc(c.telegram)+' · откроем чат после подтверждения':'Контакт не найден')+'</small></span></label>'+
   '</div></div>';
  }
  var recipientsLine=available.map(function(c){return c.email?c.name+' <'+c.email+'>':c.name}).join(', ');
  modal.innerHTML='<div class="selection-review-backdrop" data-review-close></div><div class="selection-review-dialog outreach-prep-dialog"><button class="selection-review-close" type="button" data-review-close>×</button><div class="eyebrow">Подготовка запроса</div><h2>Проверьте каналы и письмо</h2><p class="outreach-prep-lead">Email сервис отправит автоматически только после финального подтверждения. Telegram не отправляется автоматически — мы откроем чат с подготовленным текстом, а отправку подтвердите вы.</p><div class="outreach-prep-recipients">'+available.map(channelRow).join('')+'</div><div class="outreach-mail-preview"><div class="outreach-mail-toolbar"><span class="mail-dot"></span><span class="mail-dot"></span><span class="mail-dot"></span><b>Предпросмотр письма</b></div><div class="outreach-mail-meta"><div><span>От:</span><b>Сервис «Сделает» &lt;requests@onsdelaet.ru&gt;</b></div><div><span>Кому:</span><b>'+esc(recipientsLine)+'</b></div><div><span>Тема:</span><b>Запрос по задаче в сервисе «Сделает»</b></div></div><div class="outreach-mail-body">'+esc(message).replace(/\n/g,'<br>')+'</div></div><div class="selection-review-actions"><button class="account-primary" type="button" data-continue-review>Продолжить к финальной проверке →</button><button class="account-secondary" type="button" data-review-close>Вернуться к выбору</button></div></div>';
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-review-close]').forEach(function(x){x.onclick=closeSelectionReview});
  var next=modal.querySelector('[data-continue-review]');
  next.onclick=function(){
   var recipients=[];
   modal.querySelectorAll('[data-prep-candidate]').forEach(function(row){
    var id=row.dataset.prepCandidate,c=available.find(function(x){return x.id===id});if(!c)return;
    var channels=Array.from(row.querySelectorAll('[data-prep-channel]:checked')).map(function(x){return x.dataset.prepChannel});
    if(!channels.length)return;
    recipients.push({id:c.id,name:c.name||'Исполнитель',email:String(c.email||'').trim(),telegram:String(c.telegram||'').trim(),channels:channels,telegramManual:channels.includes('telegram')});
   });
   if(!recipients.length){next.disabled=false;next.textContent='Выберите хотя бы один канал';return;}
   var payload={version:5,taskId:t.taskId,orderId:t.payment&&t.payment.orderId||'',subject:'Запрос по задаче в сервисе «Сделает»',recipients:recipients,candidateIds:recipients.map(function(x){return x.id}),message:message,preparedAt:new Date().toISOString(),returnPath:'/task.html?task='+encodeURIComponent(t.taskId)+'#selection'};
   try{localStorage.setItem('sdelaet.outreach.review.v1',JSON.stringify(payload));}catch(e){return;}
   sdAccount.track('outreach_review_ready',{task_id:t.taskId,recipient_count:recipients.length});
   location.href='/review.html?outreach=1';
  };
 }
 function applySelectionFilter(filter){
  var cards=Array.from(root.querySelectorAll('.decision-candidate')),shown=0;
  cards.forEach(function(card){var yes=filter==='all'||filter==='company'&&card.dataset.candidateType!=='private'||filter==='private'&&card.dataset.candidateType==='private'||filter==='contact'&&card.dataset.candidateContact==='yes';card.hidden=!yes;if(yes)shown++;});
  root.querySelectorAll('[data-selection-filter]').forEach(function(b){b.classList.toggle('active',b.dataset.selectionFilter===filter)});
  var count=root.querySelector('#selectionVisibleCount');if(count)count.textContent='Показано '+shown;
 }
 function bindSelectionActions(t){
  root.querySelectorAll('[data-candidate-select]').forEach(function(input){input.onchange=function(){var cid=input.dataset.candidateSelect;if(input.checked)selectedCandidateIds.add(cid);else selectedCandidateIds.delete(cid);updateSelectionBar();sdAccount.track('candidate_selection_changed',{task_id:t.taskId,candidate_id:cid,selected:input.checked})}});
  root.querySelectorAll('[data-selection-filter]').forEach(function(button){button.onclick=function(){applySelectionFilter(button.dataset.selectionFilter);sdAccount.track('candidate_filter_changed',{task_id:t.taskId,filter:button.dataset.selectionFilter})}});
  var review=root.querySelector('[data-review-selected]');if(review)review.onclick=function(){openSelectionReview(t)};
  updateSelectionBar();
 }
 function bindActions(t){
  workspaceController=sdJourney.mountWorkspace(root,t,render);
  if(t.payment&&t.payment.status==='paid')bindSelectionActions(t);
 }
});
</script>
</body></html>
