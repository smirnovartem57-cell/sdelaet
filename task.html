<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задача — Сделает</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/prod-ui.css"><link rel="stylesheet" href="assets/account-v1.css?v=rich-selection-20261003">
<script src="assets/prod-ui.js?v=region-v2"></script><script defer src="assets/account-v1.js?v=region-v2"></script>
<link rel="stylesheet" href="assets/research-pricing-v2.css?v=journey-integration4-20260930"><link rel="stylesheet" href="assets/task-motion-v1.css?v=journey-integration4-20260930"><script src="assets/research-pricing-v2.js?v=journey-integration4-20260930"></script><script src="assets/task-motion-v1.js?v=journey-integration4-20260930"></script><script src="assets/task-journey-v1.js?v=rich-selection-20261003"></script><script src="assets/candidate-evidence-v1.js?v=journey-integration4-20260930"></script></head>
<body class="account-body">
<div class="account-shell">
<aside class="account-sidebar">
 <a class="account-brand" href="/"><img src="assets/logo-icon.svg" alt=""><strong>Сдела<span>ет</span></strong></a>
 <nav class="account-nav"><a class="active" href="my-tasks.html">Мои задачи</a><a href="profile.html">Профиль</a></nav>
 <div class="account-sidebar-bottom"><a href="/">На главную</a><button type="button" data-account-logout>Выйти</button></div>
</aside>
<main class="account-main">
 <header class="account-topbar"><a class="account-topbar-brand" href="/"><img src="assets/logo-icon.svg" alt=""><strong>Сдела<span>ет</span></strong></a><div class="account-topbar-actions"><span class="account-user" data-account-email></span><a class="account-secondary" href="my-tasks.html">Все задачи</a></div></header>
 <div class="account-content" id="taskRoot"><div class="account-loading">Загружаем задачу…</div></div>
</main>
</div>
<script>
document.addEventListener('DOMContentLoaded',async function(){
 var root=document.getElementById('taskRoot'),id=new URLSearchParams(location.search).get('task'),viewEvents=new Set(),selectedCandidateIds=new Set(),workspaceController=null;
 function trackWorkspaceOnce(name,params){var key=name+':'+id;if(!viewEvents.has(key)){viewEvents.add(key);sdAccount.track(name,params);}}
 if(!id){location.replace('/my-tasks.html');return}
 try{
  await sdAccount.requireAuth();
  var d=await sdAccount.api('/v1/account/tasks/'+encodeURIComponent(id)),t=d.task;
  render(t);
  if(t.research&&!(t.payment&&t.payment.status==='paid'))sdJourney.resumeCheckout({taskId:t.taskId,task:t,research:t.research,pricing:t.pricing,title:t.title,region:t.region}).catch(function(){});
 }catch(e){
  if(e.message==='AUTH_REQUIRED')return;
  if(e.message==='TASK_NOT_FOUND'){root.innerHTML='<div class="account-error">Задача не найдена или недоступна этому аккаунту. <a href="my-tasks.html">Вернуться в «Мои задачи»</a></div>';return}
  root.innerHTML='<div class="account-error">Не удалось загрузить задачу. Попробуйте обновить страницу.</div>';
 }
 function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function list(v){return Array.isArray(v)?v.filter(Boolean):[]}
 function render(t){
  document.title=t.title+' — Сделает';
  var status=t.status||{},html='';
  var researchFirst=!!t.research&&!(t.payment&&t.payment.status==='paid');
  root.classList.toggle('rp-research-first',researchFirst);
  html+='<div class="account-workspace-head"><div class="account-workspace-meta"><span class="account-status" data-status="'+esc(status.code)+'">'+esc(status.label)+'</span><span>'+esc(t.region)+'</span><span>Обновлено '+esc(sdAccount.fmtDate(t.updatedAt||t.createdAt))+'</span></div><h1>'+esc(t.title)+'</h1><div class="account-task-result">'+esc(t.keyResult)+'</div>';
  if(status.code==='draft')html+='<div style="margin-top:16px"><a href="#" class="account-primary" data-resume-task="'+esc(t.taskId)+'">Продолжить заполнение</a></div>';
  html+='</div>';

  if(!researchFirst)html+=taskSection(t);

  if(t.research||status.code==='researching')html+=researchSection(t);
  if(researchFirst)html+='<details class="rp-task-details" id="task-details"><summary>Описание и детали задачи</summary>'+taskSection(t)+'</details>';
  if(t.payment&&t.payment.status==='paid')html+=selectionSection(t);
  if((t.counts&&t.counts.outreach)||(t.replies&&t.replies.length))html+=responsesSection(t);
  if(t.offers&&t.offers.length)html+=comparisonSection(t);
  if(t.payment)html+=paymentSection(t);

  if(t.pricing&&t.pricing.repeatDiscount&&t.pricing.repeatDiscount.eligible&&t.payment&&t.payment.status==='paid'){
    html+='<div class="account-subtle-offer"><b>Есть ещё задача?</b> Для следующего подбора у вас действует скидка 30%. <a href="create-task.html?new=1" data-new-task>Создать новую задачу</a><div style="margin-top:5px">Подбор — 690 ₽ вместо 990 ₽ · До выбора — 1 790 ₽ вместо 2 590 ₽</div></div>';
    trackWorkspaceOnce('repeat_discount_shown',{surface:'task'});
  }
  sdMotion.reconcile(root,html);
  bindActions(t);
  if(t.research)trackWorkspaceOnce('research_result_open',{task_id:t.taskId});
  if(t.payment&&t.payment.status==='paid')trackWorkspaceOnce('selection_open',{task_id:t.taskId});
  if(t.offers&&t.offers.length)trackWorkspaceOnce('comparison_open',{task_id:t.taskId});
 }
 function taskSection(t){
  var j=t.taskJson||{},rows=[];
  [['Категория',j.category],['Регион',t.region],['Желаемый результат',j.goal],['Сроки',j.timing],['Объём',j.scope],['Размеры',j.wallSize]].forEach(function(x){if(x[1])rows.push('<div class="account-summary-item"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>')});
  return '<section class="account-section" id="task-description"><h2>Задача</h2><p>'+esc(t.description||t.rawService||'Описание сохранено в задаче.')+'</p>'+(rows.length?'<div class="account-summary-grid">'+rows.join('')+'</div>':'')+'</section>';
 }
 function researchSection(t){
  var r=t.research,s='<section class="account-section" id="research"><h2>Исследование рынка</h2>';
  if(!r)return s+sdMotion.statusHtml('working','Исследуем рынок','Ждём подтверждённый результат. Статус обновляется в этой задаче.')+'</section>';
  var model=sdResearchPricing.buildModel({count:r.candidateCount});
  s+='<div class="rp-research-meta"><b>На первом этапе найдено: '+esc(model.count==null?'—':model.count)+'</b><p>Это текущий результат исследования, а не лимит рынка. Данные '+esc(sdAccount.fmtDate(r.createdAt))+'.</p></div>';
  if(!(t.payment&&t.payment.status==='paid'))s+=pricingBlock(t);
  return s+'</section>';
 }
 function pricingBlock(t){
  return sdResearchPricing.renderAccount({count:t.research&&t.research.candidateCount,pricing:t.pricing||{}});
 }
 function buildOutreachMessage(t,c){
  var j=t.taskJson||{},fields=list(j.requestFields),lines=['Добрый день!','',String(t.title||j.category||'Задача'),'','Задача:','— '+String(t.description||j.description||j.scope||'Нужен расчёт по задаче')];
  if(t.region)lines.push('— Регион: '+t.region);
  if(j.goal)lines.push('— Желаемый результат: '+j.goal);
  if(j.timing)lines.push('— Сроки: '+j.timing);
  if(j.wallSize)lines.push('— Размеры: '+j.wallSize);
  lines.push('','В ответе укажите:');
  (fields.length?fields:['итоговую стоимость','что входит в работы и материалы','возможные доплаты','срок выполнения','гарантию']).forEach(function(x){lines.push('— '+x)});
  lines.push('','Ответьте, пожалуйста, обычным ответом на это письмо — сервис «Сделает» добавит предложение в сравнение.');
  return lines.join('\n');
 }
 function candidateTypeLabel(c){return c.type==='private'?'Частный мастер':c.type==='unverified'?'Тип не подтверждён':'Компания'}
 function candidateFacts(c){
  var facts=list(c.facts).slice(0,6);
  if(!facts.length)return '<div class="decision-empty">Дополнительные публичные факты пока не найдены.</div>';
  return facts.map(function(f){var st=String(f.status||'unknown'),label=st==='ok'||st==='confirmed'?'Подтверждено':st==='claim'||st==='claimed'?'Заявлено исполнителем':st==='risk'?'Требует внимания':'Не удалось проверить',cls=st==='ok'||st==='confirmed'?'ok':st==='claim'||st==='claimed'?'claim':st==='risk'?'risk':'unknown';return '<div class="decision-fact '+cls+'"><span class="decision-dot">'+(cls==='ok'?'✓':cls==='risk'?'!':cls==='claim'?'◐':'?')+'</span><div><b>'+esc(label)+'</b><p>'+esc(f.label||f.text||f.value||'Факт из источника')+'</p></div></div>'}).join('');
 }
 function candidateSignals(c){
  var out=[],e=c.evidence||{},domain=e.history&&e.history.domain,fns=e.fnsProfile||c.fnsProfile,rep=c.selectionBreakdown&&c.selectionBreakdown.reputationDetails;
  if(rep&&(rep.rating||rep.reviewsCount))out.push(['Репутация',(rep.rating?String(rep.rating):'—')+(rep.reviewsCount?' · '+rep.reviewsCount+' отзывов':'')]);
  if(domain&&domain.domain)out.push(['Домен',domain.createdAt?'с '+String(domain.createdAt).slice(0,4):domain.domain]);
  if(fns&&fns.available!==false)out.push(['Юрлицо',fns.registeredAt?'с '+String(fns.registeredAt).slice(0,4):(fns.active===false?'не действует':'проверено')]);
  if(list(c.sources).length)out.push(['Источники',String(list(c.sources).length)]);
  return out.slice(0,4).map(function(x){return '<div class="decision-signal"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'}).join('');
 }
 function candidateCard(t,c,index,attempts){
  var a=attempts.find(function(x){return x.candidateId===c.id}),why=list(c.why).slice(0,4),canSend=!!c.email&&!a,selected=selectedCandidateIds.has(c.id),site=sdJourney.safeExternalUrl(c.website),contacts='';
  if(c.phone)contacts+='<div class="decision-contact"><span>Телефон</span><b>'+esc(c.phone)+'</b></div>';
  if(c.email)contacts+='<div class="decision-contact"><span>Email</span><b>'+esc(c.email)+'</b></div>';
  if(site)contacts+='<a class="decision-contact link" href="'+esc(site)+'" target="_blank" rel="noopener"><span>Сайт / профиль</span><b>Открыть ↗</b></a>';
  var select=a?'<div class="decision-sent">Обращение: '+esc(sdJourney.outreachLabel(a.status))+'</div>':canSend?'<label class="decision-select"><input type="checkbox" data-candidate-select="'+esc(c.id)+'" '+(selected?'checked':'')+'><span><b>Выбрать для запроса</b><small>Добавим в общий запрос выбранным исполнителям</small></span></label>':'<div class="decision-unavailable"><b>Автоотправка пока недоступна</b><span>Публичный email не найден. Карточку можно использовать для ручной связи.</span></div>';
  return '<article class="decision-candidate '+(selected?'is-selected':'')+'" data-candidate-id="'+esc(c.id)+'"><div class="decision-head"><div class="decision-avatar">'+esc(String(c.name||'?').split(/\s+/).slice(0,2).map(function(x){return x.charAt(0)}).join('').toUpperCase())+'</div><div class="decision-title"><div class="decision-rank">#'+(index+1)+' · '+esc(candidateTypeLabel(c))+'</div><h3>'+esc(c.name||'Исполнитель')+'</h3><p>'+esc(c.geo||t.region||'')+'</p></div><div class="decision-match"><span>Соответствие задаче</span><b>'+esc(c.matchLevel||'Подтверждено')+'</b></div></div>'+(contacts?'<div class="decision-contacts">'+contacts+'</div>':'')+(candidateSignals(c)?'<div class="decision-signals">'+candidateSignals(c)+'</div>':'')+'<div class="decision-grid"><section><h4>Почему подходит</h4><ul>'+(why.length?why.map(function(x){return '<li>'+esc(x)+'</li>'}).join(''):'<li>Соответствие подтверждено найденными данными.</li>')+'</ul></section><section><h4>Что удалось проверить</h4><div class="decision-facts">'+candidateFacts(c)+'</div></section></div>'+sdCandidateEvidence.render(c)+select+'<button type="button" class="account-hidden" data-send-proxy="'+esc(c.id)+'"></button></article>';
 }
 function selectionSection(t){
  var attempts=t.outreach||[],candidates=t.candidates||[],cards=candidates.map(function(c,i){return candidateCard(t,c,i,attempts)}).join('');
  return '<section class="account-section decision-selection" id="selection"><div class="decision-section-head"><div><div class="eyebrow">Подбор по задаче</div><h2>Сравните исполнителей и выберите подходящих</h2><p>Порядок показывает соответствие этой задаче, а не рекламный рейтинг. Основное — на первом уровне; источники, юрданные и доказательства раскрываются отдельно.</p></div><div class="decision-count">'+candidates.length+' кандидатов</div></div><div class="decision-journey"><div class="active"><b>1 · Выберите</b><span>Сравните карточки</span></div><div><b>2 · Проверьте запрос</b><span>Получатели и текст</span></div><div><b>3 · Подтвердите</b><span>Ничего без согласия</span></div><div><b>4 · Сравним ответы</b><span>Цена, сроки, состав</span></div></div><div class="account-candidate-list decision-list">'+(cards||'<div class="account-mini-card"><p>Подбор формируется.</p></div>')+'</div><div class="decision-selection-bar" id="decisionSelectionBar" hidden><div><b><span id="decisionSelectedCount">0</span> выбрано</b><span>Проверим получателей и одинаковый запрос перед отправкой.</span></div><button class="account-primary" type="button" data-review-selected>Продолжить с выбранными →</button></div></section>';
 }
 function responsesSection(t){
  var replies=(t.replies||[]).map(function(r){var d=t.dialogues&&t.dialogues[r.request_id],state=d&&d.current_state,pending=state&&state.pending_clarifications||[];return '<div class="account-mini-card"><b>Ответ исполнителя</b><p>'+esc(r.raw_text||'Получен ответ')+'</p><p>'+esc(sdAccount.fmtDate(r.received_at))+'</p>'+(state?'<p><b>Состояние:</b> '+esc(state.comparable?'готово к сравнению':state.blocking_reason||state.status)+'</p>':'')+(pending.length?'<p><b>Нужно уточнить:</b> '+esc((pending[0].items||[]).join('; '))+'</p>':'')+'</div>'}).join('');
  var attempts=(t.outreach||[]).map(function(a){return '<div class="account-mini-card"><b>'+esc(a.candidateName||'Исполнитель')+'</b><p>Канал: '+esc(a.channel)+' · Статус: '+esc(sdJourney.outreachLabel(a.status))+'</p>'+(a.sentAt?'<p>Отправлено '+esc(sdAccount.fmtDate(a.sentAt))+'</p>':'')+(a.lastError?'<p>Ошибка: '+esc(a.lastError)+'</p>':'')+'</div>'}).join('');
  return '<section class="account-section" id="responses"><h2>Обращения и ответы</h2><p>Отправлено обращений: '+Number(t.counts&&t.counts.outreach||0)+' · Получено ответов: '+Number(t.counts&&t.counts.replies||0)+'</p><div class="account-response-list">'+attempts+replies+'</div></section>';
 }
 function comparisonSection(t){
  var cards=(t.offers||[]).map(function(o){var n=o.normalized||{},price=n.totalPrice||n.price||n.total_price||'',time=n.leadTime||n.term||n.duration||'';return '<div class="account-mini-card"><b>Предложение исполнителя</b>'+(price?'<p>Цена: '+esc(price)+'</p>':'')+(time?'<p>Срок: '+esc(time)+'</p>':'')+'<p>Статус сравнения: '+esc(o.comparisonStatus||'готово')+'</p></div>'}).join('');
  return '<section class="account-section" id="comparison"><h2>Сравнение предложений</h2><p>Сравниваем цену, состав работ, условия и неясные моменты.</p><div class="account-offer-list">'+cards+'</div></section>';
 }
 function paymentSection(t){
  var p=t.payment,type=p.priceType==='repeat'?'Повторное обращение':'Обычная цена';
  return '<section class="account-section" id="payment"><h2>Оплата</h2><div class="account-payment-grid"><div class="account-payment-cell"><span>Тариф</span><b>'+esc(p.planName)+'</b></div><div class="account-payment-cell"><span>Цена</span><b>'+esc(sdAccount.money(p.amount))+(p.priceType==='repeat'?' вместо '+esc(sdAccount.money(p.regularAmount)):'')+'</b></div><div class="account-payment-cell"><span>Тип цены</span><b>'+esc(type)+'</b></div><div class="account-payment-cell"><span>Статус</span><b>'+esc(sdJourney.paymentLabel(p.status))+'</b></div></div><p>'+esc(sdAccount.fmtDate(p.paidAt||p.createdAt))+'</p></section>';
 }
 function updateSelectionBar(){
  var bar=document.getElementById('decisionSelectionBar'),count=document.getElementById('decisionSelectedCount');if(!bar||!count)return;
  count.textContent=String(selectedCandidateIds.size);bar.hidden=selectedCandidateIds.size===0;
  root.querySelectorAll('.decision-candidate').forEach(function(card){card.classList.toggle('is-selected',selectedCandidateIds.has(card.dataset.candidateId))});
 }
 function closeSelectionReview(){var m=document.getElementById('selectionReviewModal');if(m)m.remove()}
 async function openSelectionReview(t){
  var candidates=(t.candidates||[]).filter(function(c){return selectedCandidateIds.has(c.id)});if(!candidates.length)return;
  var sendable=candidates.filter(function(c){return !!c.email&&!((t.outreach||[]).some(function(a){return a.candidateId===c.id}))});
  var modal=document.createElement('div');modal.id='selectionReviewModal';modal.className='selection-review-modal';
  var message=buildOutreachMessage(t);
  modal.innerHTML='<div class="selection-review-backdrop" data-review-close></div><div class="selection-review-dialog"><button class="selection-review-close" type="button" data-review-close>×</button><div class="eyebrow">Проверка перед отправкой</div><h2>Кому отправим запрос</h2><div class="selection-review-recipients">'+candidates.map(function(c){return '<div><b>'+esc(c.name)+'</b><span>'+(c.email?esc(c.email):'Публичный email не найден — только ручная связь')+'</span></div>'}).join('')+'</div><h3>Одинаковый запрос для всех</h3><pre>'+esc(message)+'</pre><p class="selection-review-note">Запросы не отправляются до следующего подтверждения. Исполнители без публичного email останутся в подборе, но автоматически письмо им не уйдёт.</p><div class="selection-review-actions"><button class="account-primary" type="button" data-confirm-group-send '+(sendable.length?'':'disabled')+'>Подтвердить и отправить '+sendable.length+'</button><button class="account-secondary" type="button" data-review-close>Вернуться к выбору</button></div></div>';
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-review-close]').forEach(function(x){x.onclick=closeSelectionReview});
  var confirm=modal.querySelector('[data-confirm-group-send]');if(confirm)confirm.onclick=async function(){confirm.disabled=true;confirm.textContent='Отправляем…';var ok=0;for(var i=0;i<sendable.length;i++){var c=sendable[i],proxy=root.querySelector('[data-send-proxy="'+CSS.escape(c.id)+'"]')||confirm;var sent=await sdJourney.sendOutreach(workspaceController,c.id,proxy,{skipConfirm:true});if(sent)ok++;}closeSelectionReview();selectedCandidateIds.clear();updateSelectionBar();if(workspaceController)await workspaceController.refresh();};
 }
 function bindSelectionActions(t){
  root.querySelectorAll('[data-candidate-select]').forEach(function(input){input.onchange=function(){var cid=input.dataset.candidateSelect;if(input.checked)selectedCandidateIds.add(cid);else selectedCandidateIds.delete(cid);updateSelectionBar();sdAccount.track('candidate_selection_changed',{task_id:t.taskId,candidate_id:cid,selected:input.checked})}});
  var review=root.querySelector('[data-review-selected]');if(review)review.onclick=function(){openSelectionReview(t)};
  updateSelectionBar();
 }
 function bindActions(t){
  workspaceController=sdJourney.mountWorkspace(root,t,render);
  if(t.payment&&t.payment.status==='paid')bindSelectionActions(t);
 }
});
</script>
</body></html>
