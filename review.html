<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка перед отправкой — Сделает</title><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script><style>body{background:var(--bg)}.review{max-width:900px;margin:0 auto;padding:34px 18px 70px}.review-card{padding:24px}.recipients{display:grid;gap:8px;margin:16px 0}.recipient{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}.recipient b,.recipient span{display:block}.recipient span{margin-top:3px;color:var(--muted);font-size:12px}.message{white-space:pre-wrap;padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;line-height:1.55}.confirm{display:flex;gap:10px;align-items:flex-start;margin:18px 0;padding:14px;border:1px solid #eadcae;border-radius:14px;background:#fff9e8}.confirm input{margin-top:3px}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="review"><section class="card review-card"><div class="eyebrow">Финальная проверка</div><h1 class="hero-title">Проверьте перед отправкой</h1><p class="lead">До вашего подтверждения ничего исполнителям не отправляется.</p><div class="label">Получатели</div><div class="recipients" id="recipients"></div><div class="label">Текст запроса</div><div class="message" id="message"></div><label class="confirm"><input type="checkbox" id="confirm"><span><b>Я проверил получателей и текст запроса</b><br>После следующего подтверждения запрос можно будет отправить выбранным исполнителям.</span></label><div class="actions"><button class="btn primary large" id="send" disabled>Подтвердить отправку →</button><a class="btn secondary large" href="requests.html?selected=1">← Изменить</a></div><div id="status" class="hidden" style="margin-top:14px"></div></section></main><script>(function(){let r=null;try{r=JSON.parse(localStorage.getItem('sdelaet.outreach.review.v1')||'null')}catch{}if(!r||!r.taskId||!r.orderId||!Array.isArray(r.recipients)||!r.recipients.length||!r.message){location.replace('requests.html?selected=1');return}document.getElementById('recipients').innerHTML=r.recipients.map(x=>'<div class="recipient"><b>'+String(x.name||'Исполнитель').replace(/[<>&]/g,'')+'</b><span>Будет включён только после серверного разрешения</span></div>').join('');document.getElementById('message').textContent=r.message;const c=document.getElementById('confirm'),b=document.getElementById('send'),st=document.getElementById('status');c.onchange=()=>b.disabled=!c.checked;b.onclick=async()=>{if(!c.checked)return;b.disabled=true;b.textContent='Проверяем разрешение…';st.className='hidden';let key='oa-'+r.taskId+'-'+r.candidateIds.slice().sort().join('-')+'-'+r.preparedAt;try{let resp=await fetch('/api/v1/outreach/authorize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskId:r.taskId,orderId:r.orderId,candidateIds:r.candidateIds,message:r.message,explicitConfirm:true,idempotencyKey:key})});let d=await resp.json().catch(()=>({}));if(!resp.ok||!d.ok||!d.authorized)throw new Error(d.error||'AUTH_FAILED');localStorage.setItem('sdelaet.outreach.authorization.v1',JSON.stringify({authorizationId:d.authorizationId,taskId:r.taskId,orderId:r.orderId,candidateIds:r.candidateIds,messageSha256:d.messageSha256,authorizedAt:new Date().toISOString()}));let sent=0,skipped=0;for(const x of r.recipients){let email=String(x.email||'').trim();if(!email){skipped++;continue}let prep=await fetch('/api/v1/outreach/prepare',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({authorizationId:d.authorizationId,taskId:r.taskId,candidateId:x.id,candidate:{id:x.id,name:x.name||'Исполнитель',email:email},channel:'email',recipient:email,subject:'Запрос по задаче в сервисе «Сделает»',message:r.message})});let pd=await prep.json().catch(()=>({}));if(!prep.ok||!pd.ok||!pd.outreach?.requestId)throw new Error(pd.error||'PREPARE_FAILED');let send=await fetch('/api/v1/outreach/email/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({authorizationId:d.authorizationId,requestId:pd.outreach.requestId})});let sd=await send.json().catch(()=>({}));if(!send.ok||!sd.ok)throw new Error(sd.error||'SEND_FAILED');sent++}st.className='';st.textContent=sent?'Отправлено: '+sent+(skipped?' · без email: '+skipped:''):'Разрешение получено, но у выбранных исполнителей нет доступного email.';b.textContent=sent?'Отправлено ✓':'Разрешение получено ✓';if(window.sdTrack)sdTrack('outreach_authorized',{count:r.candidateIds.length,sent_email:sent,plan:d.plan})}catch(e){st.className='';st.textContent='Не удалось подтвердить отправку: '+(e.message||'ошибка');b.disabled=false;b.textContent='Подтвердить отправку →'}}})();</script></body></html>
