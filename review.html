<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка перед отправкой — Сделает</title><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script><style>body{background:var(--bg)}.review{max-width:900px;margin:0 auto;padding:34px 18px 70px}.review-card{padding:24px}.recipients{display:grid;gap:8px;margin:16px 0}.recipient{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}.recipient b,.recipient span{display:block}.recipient span{margin-top:3px;color:var(--muted);font-size:12px}.message{white-space:pre-wrap;padding:16px;border:1px solid var(--line);border-radius:15px;background:#fff;line-height:1.55}.confirm{display:flex;gap:10px;align-items:flex-start;margin:18px 0;padding:14px;border:1px solid #eadcae;border-radius:14px;background:#fff9e8}.confirm input{margin-top:3px}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="review"><section class="card review-card"><div class="eyebrow">Финальная проверка</div><h1 class="hero-title">Проверьте перед отправкой</h1><p class="lead">До вашего подтверждения ничего исполнителям не отправляется.</p><div class="label">Получатели</div><div class="recipients" id="recipients"></div><div class="label">Текст запроса</div><div class="message" id="message"></div><label class="confirm"><input type="checkbox" id="confirm"><span><b>Я проверил получателей и текст запроса</b><br>После следующего подтверждения запрос можно будет отправить выбранным исполнителям.</span></label><div class="actions"><button class="btn primary large" id="send" disabled>Подтвердить отправку →</button><a class="btn secondary large" href="requests.html?selected=1">← Изменить</a></div><div id="status" class="hidden" style="margin-top:14px"></div></section></main><script>(function(){let r=null;try{r=JSON.parse(localStorage.getItem('sdelaet.outreach.review')||'null')}catch{}if(!r||!Array.isArray(r.recipients)||!r.recipients.length){location.replace('candidates.html');return}document.getElementById('recipients').innerHTML=r.recipients.map(x=>'<div class="recipient"><b>'+String(x.name||'Исполнитель').replace(/[<>&]/g,'')+'</b><span>Канал будет использован только после явного подтверждения</span></div>').join('');document.getElementById('message').textContent=r.message||'';const c=document.getElementById('confirm'),b=document.getElementById('send'),s=document.getElementById('status');c.onchange=()=>b.disabled=!c.checked;b.onclick=()=>{if(!c.checked)return;s.className='';s.textContent='Подтверждение сохранено. Серверная отправка будет включена только через защищённый outreach endpoint.';localStorage.setItem('sdelaet.outreach.explicit-confirm',JSON.stringify({taskId:r.taskId,recipientIds:r.recipients.map(x=>x.id),confirmedAt:new Date().toISOString()}));b.disabled=true;b.textContent='Подтверждено ✓';if(window.sdTrack)sdTrack('outreach_explicit_confirm',{count:r.recipients.length})}})();</script></body></html>
