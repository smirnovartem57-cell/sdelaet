<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ответы исполнителей — Сделает</title><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script><script src="assets/offer-parser.js"></script><script src="assets/offer-followup.js"></script><script src="assets/offer-merge.js"></script><script src="assets/offer-normalizer.js"></script><style>.offer-form{display:grid;gap:10px}.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.offer-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.offer-card h3{margin:0 0 8px}.mini{font-size:12px;color:var(--muted)}.parse-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.parse-result{font-size:12px;color:var(--muted)}.followup-box{padding:12px;border:1px solid #dbe3f7;background:#f8faff;border-radius:14px}.history{display:grid;gap:7px;margin-top:8px}.history-item{font-size:12px;color:var(--muted);padding:8px 10px;border-radius:10px;background:#fafbfe}@media(max-width:700px){.offer-grid{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><div>Сдела<span>ет</span></div></a><nav class="app-nav"><a href="my-tasks.html">▤ Мои задачи</a><a href="create-task.html">＋ Новая задача</a></nav></aside><main class="app-main"><div class="app-content"><div class="page"><section class="card"><div class="eyebrow">Ответы исполнителей</div><h1 class="hero-title">Добавьте полученные предложения</h1><p class="lead">Можно просто вставить ответ исполнителя целиком. После уточнений система объединит новые данные с исходной офертой и пересчитает сравнение.</p><div id="offers"></div><div class="actions"><button class="btn secondary" id="addOffer">＋ Добавить предложение</button><button class="btn primary large" id="compareBtn">Сравнить предложения →</button></div></section></div></div></main></div><script>
(function(){var box=document.getElementById('offers');var seed=JSON.parse(localStorage.getItem('sdelaet.offers.raw.v1')||'[]');if(!seed.length)seed=[{}];var task=sdGetTask?sdGetTask():{};
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function form(o,i){var d=document.createElement('div');d.className='offer-card';var history=(o.followUps||[]).map(function(h){return'<div class="history-item">'+esc(h.text||'')+'</div>'}).join('');d.innerHTML='<h3>Предложение '+(i+1)+'</h3><div class="offer-form"><input data-k="candidateName" placeholder="Исполнитель / компания" value="'+esc(o.candidateName||'')+'"><textarea data-k="rawResponse" placeholder="Вставьте сюда ответ исполнителя целиком">'+esc(o.rawResponse||'')+'</textarea><div class="parse-actions"><button type="button" class="btn secondary" data-action="parse">Разобрать ответ</button><button type="button" class="btn secondary" data-action="followup">Сформировать уточнение</button><span class="parse-result" data-role="parseResult"></span></div><div class="followup-box hidden" data-role="followupBox"><div class="mini">Сообщение исполнителю</div><textarea data-role="followupText" readonly></textarea><div class="parse-actions"><button type="button" class="btn secondary" data-action="copyFollowup">Скопировать</button></div></div><div class="offer-grid"><input data-k="totalPrice" placeholder="Итоговая цена, ₽" value="'+esc(o.totalPrice||'')+'"><select data-k="materialsIncluded"><option value="">Материалы: неясно</option><option value="yes">Материалы включены</option><option value="no">Материалы отдельно</option></select></div><input data-k="materialsPrice" placeholder="Стоимость материалов отдельно, ₽" value="'+esc(o.materialsPrice||'')+'"><textarea data-k="worksIncluded" placeholder="Что входит в работы — по одному пункту с новой строки">'+esc((o.worksIncluded||[]).join('\n'))+'</textarea><textarea data-k="exclusions" placeholder="Что не входит / исключения">'+esc((o.exclusions||[]).join('\n'))+'</textarea><textarea data-k="extraCosts" placeholder="Возможные доплаты">'+esc((o.extraCosts||[]).join('\n'))+'</textarea><div class="offer-grid"><input data-k="leadTime" placeholder="Срок работ" value="'+esc(o.leadTime||'')+'"><input data-k="warranty" placeholder="Гарантия" value="'+esc(o.warranty||'')+'"></div><div><div class="mini">Ответ на уточнение исполнителя</div><textarea data-role="followupReply" placeholder="Вставьте сюда ответ на уточнение"></textarea><div class="parse-actions"><button type="button" class="btn secondary" data-action="mergeFollowup">Объединить с предложением</button></div></div>'+(history?'<div><div class="mini">История уточнений</div><div class="history">'+history+'</div></div>':'')+'</div>';var s=d.querySelector('[data-k="materialsIncluded"]');s.value=o.materialsIncluded===true?'yes':o.materialsIncluded===false?'no':'';
function readCard(){var x={};d.querySelectorAll('[data-k]').forEach(function(el){var k=el.dataset.k,v=el.value.trim();if(['worksIncluded','exclusions','extraCosts'].indexOf(k)>=0)x[k]=v?v.split(/\n+/).map(function(z){return z.trim()}).filter(Boolean):[];else if(k==='materialsIncluded')x[k]=v==='yes'?true:v==='no'?false:null;else x[k]=v});x.followUps=o.followUps||[];return x}
function fill(x){[['totalPrice',x.totalPrice],['materialsPrice',x.materialsPrice],['leadTime',x.leadTime],['warranty',x.warranty]].forEach(function(a){if(a[1]!=null&&a[1]!=='')d.querySelector('[data-k="'+a[0]+'"]').value=a[1]});if(x.materialsIncluded!=null)d.querySelector('[data-k="materialsIncluded"]').value=x.materialsIncluded?'yes':'no';[['worksIncluded',x.worksIncluded],['exclusions',x.exclusions],['extraCosts',x.extraCosts]].forEach(function(a){if(a[1]&&a[1].length)d.querySelector('[data-k="'+a[0]+'"]').value=a[1].join('\n')});if(x.rawResponse)d.querySelector('[data-k="rawResponse"]').value=x.rawResponse}
d.querySelector('[data-action="parse"]').onclick=function(){var raw=d.querySelector('[data-k="rawResponse"]').value.trim();if(!raw){alert('Сначала вставьте ответ исполнителя.');return}var p=sdOfferParser.parse(raw);fill(p);var found=[];if(p.totalPrice)found.push('цена');if(p.materialsIncluded!=null)found.push('материалы');if(p.worksIncluded.length)found.push('состав работ');if(p.leadTime)found.push('срок');if(p.warranty)found.push('гарантия');d.querySelector('[data-role="parseResult"]').textContent=found.length?'Распознано: '+found.join(', '):'Ключевые параметры не распознаны — заполните вручную.'};
d.querySelector('[data-action="followup"]').onclick=function(){var current=readCard(),parsed=sdOfferParser.parse(current.rawResponse||''),merged=Object.assign({},parsed,current),f=sdOfferFollowup.build(merged,task),box=d.querySelector('[data-role="followupBox"]'),ta=d.querySelector('[data-role="followupText"]');if(!f.needed){box.classList.remove('hidden');ta.value='Дополнительных уточнений не требуется.';return}box.classList.remove('hidden');ta.value=f.message};
d.querySelector('[data-action="copyFollowup"]').onclick=function(){var v=d.querySelector('[data-role="followupText"]').value;if(navigator.clipboard)navigator.clipboard.writeText(v)};
d.querySelector('[data-action="mergeFollowup"]').onclick=function(){var reply=d.querySelector('[data-role="followupReply"]').value.trim();if(!reply){alert('Вставьте ответ исполнителя на уточнение.');return}var current=readCard(),merged=sdOfferMerge.merge(current,reply,sdOfferParser);fill(merged);o=merged;d.querySelector('[data-role="followupReply"]').value='';d.querySelector('[data-role="parseResult"]').textContent='Уточнение объединено. Предложение обновлено.';seed=collect();localStorage.setItem('sdelaet.offers.raw.v1',JSON.stringify(seed));render()};return d}
function render(){box.innerHTML='';seed.forEach(function(o,i){box.appendChild(form(o,i))})}
function collect(){return Array.from(box.children).map(function(card,idx){var o={};card.querySelectorAll('[data-k]').forEach(function(el){var k=el.dataset.k,v=el.value.trim();if(['worksIncluded','exclusions','extraCosts'].indexOf(k)>=0)o[k]=v?v.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean):[];else if(k==='materialsIncluded')o[k]=v==='yes'?true:v==='no'?false:null;else o[k]=v});o.followUps=(seed[idx]&&seed[idx].followUps)||[];var parsed=window.sdOfferParser?sdOfferParser.parse(o.rawResponse||''):{};o.priceType=parsed.priceType||'fixed';return o})}
document.getElementById('addOffer').onclick=function(){seed=collect();seed.push({});render()};document.getElementById('compareBtn').onclick=function(){var raw=collect();localStorage.setItem('sdelaet.offers.raw.v1',JSON.stringify(raw));localStorage.setItem('sdelaet.offers.normalized.v1',JSON.stringify(sdOfferNormalizer.rank(raw,task)));location.href='compare.html'};render()})();
</script></body></html>
