<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ответы исполнителей — Сделает</title><link rel="stylesheet" href="assets/prod-ui.css"><script src="assets/prod-ui.js"></script><script src="assets/offer-parser.js"></script><script src="assets/offer-normalizer.js"></script><style>.offer-form{display:grid;gap:10px}.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.offer-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.offer-card h3{margin:0 0 8px}.mini{font-size:12px;color:var(--muted)}.parse-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.parse-result{font-size:12px;color:var(--muted)}@media(max-width:700px){.offer-grid{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><div>Сдела<span>ет</span></div></a><nav class="app-nav"><a href="my-tasks.html">▤ Мои задачи</a><a href="create-task.html">＋ Новая задача</a></nav></aside><main class="app-main"><div class="app-content"><div class="page"><section class="card"><div class="eyebrow">Ответы исполнителей</div><h1 class="hero-title">Добавьте полученные предложения</h1><p class="lead">Можно просто вставить ответ исполнителя целиком. Сервис сам разберёт основные параметры, а вы при необходимости поправите результат.</p><div id="offers"></div><div class="actions"><button class="btn secondary" id="addOffer">＋ Добавить предложение</button><button class="btn primary large" id="compareBtn">Сравнить предложения →</button></div></section></div></div></main></div><script>
(function(){var box=document.getElementById('offers');var seed=JSON.parse(localStorage.getItem('sdelaet.offers.raw.v1')||'[]');if(!seed.length)seed=[{}];var task=sdGetTask?sdGetTask():{};
function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function form(o,i){var d=document.createElement('div');d.className='offer-card';d.innerHTML='<h3>Предложение '+(i+1)+'</h3><div class="offer-form"><input data-k="candidateName" placeholder="Исполнитель / компания" value="'+esc(o.candidateName||'')+'"><textarea data-k="rawResponse" placeholder="Вставьте сюда ответ исполнителя целиком">'+esc(o.rawResponse||'')+'</textarea><div class="parse-actions"><button type="button" class="btn secondary" data-action="parse">Разобрать ответ</button><span class="parse-result" data-role="parseResult"></span></div><div class="offer-grid"><input data-k="totalPrice" placeholder="Итоговая цена, ₽" value="'+esc(o.totalPrice||'')+'"><select data-k="materialsIncluded"><option value="">Материалы: неясно</option><option value="yes">Материалы включены</option><option value="no">Материалы отдельно</option></select></div><input data-k="materialsPrice" placeholder="Стоимость материалов отдельно, ₽" value="'+esc(o.materialsPrice||'')+'"><textarea data-k="worksIncluded" placeholder="Что входит в работы — по одному пункту с новой строки">'+esc((o.worksIncluded||[]).join('\n'))+'</textarea><textarea data-k="exclusions" placeholder="Что не входит / исключения">'+esc((o.exclusions||[]).join('\n'))+'</textarea><textarea data-k="extraCosts" placeholder="Возможные доплаты">'+esc((o.extraCosts||[]).join('\n'))+'</textarea><div class="offer-grid"><input data-k="leadTime" placeholder="Срок работ" value="'+esc(o.leadTime||'')+'"><input data-k="warranty" placeholder="Гарантия" value="'+esc(o.warranty||'')+'"></div></div>';var s=d.querySelector('[data-k="materialsIncluded"]');s.value=o.materialsIncluded===true?'yes':o.materialsIncluded===false?'no':'';d.querySelector('[data-action="parse"]').onclick=function(){var raw=d.querySelector('[data-k="rawResponse"]').value.trim();if(!raw){alert('Сначала вставьте ответ исполнителя.');return}var p=sdOfferParser.parse(raw);[['totalPrice',p.totalPrice],['materialsPrice',p.materialsPrice],['leadTime',p.leadTime],['warranty',p.warranty]].forEach(function(x){if(x[1]!=null&&x[1]!=='')d.querySelector('[data-k="'+x[0]+'"]').value=x[1]});if(p.materialsIncluded!=null)d.querySelector('[data-k="materialsIncluded"]').value=p.materialsIncluded?'yes':'no';[['worksIncluded',p.worksIncluded],['exclusions',p.exclusions],['extraCosts',p.extraCosts]].forEach(function(x){if(x[1]&&x[1].length)d.querySelector('[data-k="'+x[0]+'"]').value=x[1].join('\n')});var found=[];if(p.totalPrice)found.push('цена');if(p.materialsIncluded!=null)found.push('материалы');if(p.worksIncluded.length)found.push('состав работ');if(p.leadTime)found.push('срок');if(p.warranty)found.push('гарантия');d.querySelector('[data-role="parseResult"]').textContent=found.length?'Распознано: '+found.join(', '):'Ключевые параметры не распознаны — заполните вручную.';};return d}
function render(){box.innerHTML='';seed.forEach(function(o,i){box.appendChild(form(o,i))})}
function collect(){return Array.from(box.children).map(function(card){var o={};card.querySelectorAll('[data-k]').forEach(function(el){var k=el.dataset.k,v=el.value.trim();if(['worksIncluded','exclusions','extraCosts'].indexOf(k)>=0)o[k]=v?v.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean):[];else if(k==='materialsIncluded')o[k]=v==='yes'?true:v==='no'?false:null;else o[k]=v});var parsed=window.sdOfferParser?sdOfferParser.parse(o.rawResponse||''):{};o.priceType=parsed.priceType||'fixed';return o})}
document.getElementById('addOffer').onclick=function(){seed=collect();seed.push({});render()};document.getElementById('compareBtn').onclick=function(){var raw=collect();localStorage.setItem('sdelaet.offers.raw.v1',JSON.stringify(raw));localStorage.setItem('sdelaet.offers.normalized.v1',JSON.stringify(sdOfferNormalizer.rank(raw,task)));location.href='compare.html'};render()})();
</script></body></html>
